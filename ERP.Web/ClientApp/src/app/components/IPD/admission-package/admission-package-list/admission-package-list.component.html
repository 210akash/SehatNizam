<div class="header-container">
  <h2>Admission Packages</h2>
  <button mat-mini-fab aria-label="Add" color="success" (click)="openDialog(null)" matTooltip="Add Package">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="body-container">
  <form [formGroup]="filterForm">
    <div class="row">
      <div class="col-md-6">
        <div class="mt-2">
          <mat-form-field class="form-field">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" (keyup)="filterData()">
          </mat-form-field>
        </div>
      </div>
    </div>
  </form>

  <div class="mat-elevation-z8 table-responsive mt-2">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
        <td mat-cell *matCellDef="let element">{{ element.description }}</td>
      </ng-container>

      <ng-container matColumnDef="servicesCount">
        <th mat-header-cell *matHeaderCellDef>Services</th>
        <td mat-cell *matCellDef="let element" class="services-cell">
          <div>{{ getServicesCount(element) }} Service(s)</div>
          <div class="services-total">Total: {{ getServicesTotal(element) | number:'1.2-2' }}</div>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef style="width: 11%;">Actions</th>
        <td mat-cell *matCellDef="let element">
          <div class="action_btns">
            <button mat-mini-fab matTooltip="Edit" color="primary" (click)="openDialog(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-mini-fab matTooltip="View" color="dark" (click)="viewDialog(element)">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-mini-fab matTooltip="Delete" color="warn" (click)="deleteDialog(element)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator #paginator [length]="totalRows" [pageIndex]="currentPage" [pageSize]="take"
      [pageSizeOptions]="pageSizeOptions" (page)="pageChanged($event)" aria-label="Select page">
    </mat-paginator>
  </div>
</div>
