<mat-card>
  <mat-card-header>
    <mat-card-title>Admission Services Form</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <form [formGroup]="admissionServiceForm" class="modern-form mt-3">
      <div class="row">
         <div class="col-md-12">
            <mat-form-field appearance="outline">
            <mat-label>Service</mat-label>
            <mat-select formControlName="serviceId" (selectionChange)="selectService($event)">
              <mat-option *ngFor="let s of serviceList" [value]="s.id">{{ s.name }} |  {{ s.serviceType.name }}</mat-option>
            </mat-select>
          </mat-form-field>
         </div>
        <div class="col-md-4">
          <mat-form-field appearance="outline">
            <mat-label>Rate</mat-label>
            <input type="number" matInput class="form-control" formControlName="basePrice" readonly />
          </mat-form-field>
        </div>
        <div class="col-md-4">
          <mat-form-field appearance="outline">
            <mat-label>Discount</mat-label>
            <input type="number" matInput class="form-control" formControlName="discount" min="0"
              [max]="this.admissionServiceForm.get('basePrice')?.value" (keyup)="calculateTotalPayable()" />
          </mat-form-field>
        </div>
        <div class="col-md-4">
          <mat-form-field appearance="outline">
            <mat-label>Payable Amount</mat-label>
            <input type="number" matInput class="form-control" formControlName="payable" />
          </mat-form-field>
        </div>
         <div class="col-md-12">
          <mat-form-field appearance="outline">
            <mat-label>Payment Mode</mat-label>
            <mat-select formControlName="paymentModeId">
              <mat-option *ngFor="let p of paymentModesList" [value]="p.id">{{ p.name }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </form>

    <div class="button-container">
      <button mat-flat-button color="primary" type="button" (click)="SaveData()">
        <span class="mat-button-wrapper">Save</span>
      </button>
      <button mat-flat-button color="warn" [mat-dialog-close]="true">
        <span class="mat-button-wrapper">Close</span>
      </button>
    </div>
  </mat-card-content>
</mat-card>
