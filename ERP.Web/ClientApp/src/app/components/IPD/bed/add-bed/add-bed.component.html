<mat-card>
  <mat-card-header>
    <mat-card-title>Bed Form</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <form [formGroup]="bedForm" >
      <input type="hidden" formControlName="id" />
      <div  class="row justify-content-center">
        <div class="col-md-3">
      <mat-form-field  style="width: 100%;">
        <mat-label>Code</mat-label>
        <input matInput formControlName="code" type="text" readonly class="text-center">
      </mat-form-field>
    </div>
  </div>
  
      <div class="row">
        <div class="col-md-6">
          <mat-form-field class="form-field" [ngClass]="this.isEditMode ?  'readonly-wrapper' : ''" >
            <mat-label>Ward</mat-label>
            <mat-select formControlName="wardId" (selectionChange)="getroomList();reset()">
              <mat-option *ngFor="let ward of wardList" [value]="ward.id" >
                {{ ward.code }} :  {{ ward.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field class="form-field" [ngClass]="this.isEditMode ?  'readonly-wrapper' : ''" >
            <mat-label>Room</mat-label>
            <mat-select formControlName="roomId" (selectionChange)="getBedCode()">
              <mat-option *ngFor="let room of roomList" [value]="room.id" >
                {{ room.code }} :  {{ room.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
    <div class="col-md-12">
      <mat-form-field style="width: 100%;">
        <mat-label>Bed No</mat-label>
        <input matInput formControlName="bedNo" type="text">
      </mat-form-field>
    </div>
    </div>
    <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="success" type="button" (click)="SaveData()">
          <span class="mat-button-wrapper">Save</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </form>

  </mat-card-content>

</mat-card>
