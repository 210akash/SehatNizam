<form [formGroup]="dischargeForm">
  <mat-card>
    <mat-card-header>
      <div class="header-container">
        <mat-card-title>IPD Discharge</mat-card-title>
      </div>
    </mat-card-header>
    <mat-divider></mat-divider>
    <mat-card-content>
      <input type="hidden" formControlName="id" />
      <div class="row justify-content-center">
        <div class="col-md-2">
          <mat-form-field class="form-field">
            <mat-label>Discharge Date.</mat-label>
            <input matInput [matDatepicker]="date" formControlName="dischargeDate" tabindex="-1">
            <mat-datepicker-toggle matIconSuffix [for]="date"></mat-datepicker-toggle>
            <mat-datepicker #date></mat-datepicker>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field>
            <mat-label>Discharge Summary.</mat-label>
            <textarea matInput formControlName="dischargeSummary" type="text">
            </textarea>
          </mat-form-field>
        </div>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-2">
          <div class="btn btn-rose btn-file text-center">
            <span class="fileinput-new">Select Documents</span>
            <input type="file" formControlName="file" name="" accept=".pdf, .jpeg, .jpg, .png"
              (change)="onFileBrowse($event)" multiple>
          </div>
        </div>
      </div>
      <div class="row media_wrap mt-2 mb-2">
        <div class="uploaded_doc_wrap col-md-2" *ngFor="let media of uploadedMedia; let i = index">
          <div class="file_upload text-center doucment_wrap">
            <i class="fa fa-remove remove_btn" (click)="removeImage(i)"></i>
            <div class="w-100 d-inline-block" (click)="GetDocument($event, media.FileName, documentView)">
              <div class="fa fa-file-text-o fa-2x"></div>
              <div class="" style="font-size: 12px; font-weight: 900;word-break: break-all;margin-top: 5px;">
                {{ media.FileName }}
              </div>
              <div [ngStyle]="{ 'width.%': media.FileProgress }" class="second-progress"></div>
            </div>
          </div>
        </div>
      </div>
      <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="success" type="button" (click)="SaveData()">
          <span class="mat-button-wrapper">Save</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</form>

<ng-template #documentView>
  <mat-card>
    <mat-card-header>
      <div class="header-container">
        <mat-card-title>Voucher Documents</mat-card-title>
      </div>
      <div class="button-container">
        <button mat-mini-fab color="danger" [mat-dialog-close]="true">
          <mat-icon class="m-0">close</mat-icon>
        </button>
      </div>
    </mat-card-header>
    <mat-divider></mat-divider>
    <mat-card-content>
      <iframe width="100%" height="600px" frameBorder="0" [src]="urlSafe"></iframe>
      <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="danger" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</ng-template>
