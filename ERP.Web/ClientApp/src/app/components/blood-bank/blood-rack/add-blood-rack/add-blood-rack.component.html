<mat-card>
  <mat-card-header><mat-card-title>{{ dialogTitle }}</mat-card-title></mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content *ngIf="!isLoading">
    <form [formGroup]="form">
      <div class="row">        <div class="col-md-12">
          <mat-form-field style="width: 100%;">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" type="text" maxlength="50" [readonly]="isViewMode">
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field style="width: 100%;">
            <mat-label>Blood Fridge</mat-label>
            <mat-select formControlName="bloodFridgeId">
              <mat-option *ngFor="let item of fridgeList" [value]="item.id">{{ item.code }} - {{ item.name }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <mat-divider></mat-divider>
      <div class="button-container">
        <button *ngIf="!isViewMode" mat-flat-button color="success" type="button" (click)="saveData()" [disabled]="isLoading">Save</button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">Close</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
