<mat-card>
  <mat-card-header><mat-card-title>{{ dialogTitle }}</mat-card-title></mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content *ngIf="!isLoading">
    <form [formGroup]="form">
      <div class="row">
        <div class="col-md-12">
          <mat-form-field style="width: 100%;">
            <mat-label>Donor</mat-label>
            <input matInput [formControl]="donorSearchCtrl" [matAutocomplete]="donorAuto"
              placeholder="Search by Name, CNIC or Blood Group" [readonly]="isViewMode">
            <mat-autocomplete #donorAuto="matAutocomplete" [displayWith]="displayDonor"
              (optionSelected)="onDonorSelected($event.option.value)">
              <mat-option *ngFor="let donor of filteredDonors$ | async" [value]="donor">
                {{ displayDonor(donor) }}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>
        <div class="col-md-4" *ngIf="selectedDonor">
          <mat-form-field style="width: 100%;">
            <mat-label>Donor Name</mat-label>
            <input matInput [value]="selectedDonor.name" type="text" readonly>
          </mat-form-field>
        </div>
        <div class="col-md-4" *ngIf="selectedDonor">
          <mat-form-field style="width: 100%;">
            <mat-label>Donor CNIC</mat-label>
            <input matInput [value]="selectedDonor.cnic" type="text" readonly>
          </mat-form-field>
        </div>
        <div class="col-md-4" *ngIf="selectedDonor">
          <mat-form-field style="width: 100%;">
            <mat-label>Donor Blood Group</mat-label>
            <input matInput [value]="getDonorBloodGroupName(selectedDonor)" type="text" readonly>
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field style="width: 100%;">
            <mat-label>Component Type</mat-label>
            <mat-select formControlName="bloodComponentTypeId" [disabled]="isViewMode">
              <mat-option *ngFor="let item of componentTypeList" [value]="item.id">{{ item.code }} - {{ item.name }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field style="width: 100%;">
            <mat-label>Donation Date</mat-label>
            <input matInput [matDatepicker]="donationDatePicker" formControlName="donationDate"
              placeholder="DD/MM/YYYY" [max]="maxDate" [readonly]="isViewMode">
            <mat-datepicker-toggle matIconSuffix [for]="donationDatePicker" *ngIf="!isViewMode"></mat-datepicker-toggle>
            <mat-datepicker #donationDatePicker></mat-datepicker>
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field style="width: 100%;">
            <mat-label>Volume (ml)</mat-label>
            <input matInput formControlName="volume" type="number" min="0" [readonly]="isViewMode">
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field style="width: 100%;">
            <mat-label>Screening Status</mat-label>
            <mat-select formControlName="screeningStatus" [disabled]="isViewMode || isScreeningStatusLocked">
              <mat-option *ngFor="let item of screeningStatusList" [value]="item.value">{{ item.name }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field style="width: 100%;">
            <mat-label>Remarks</mat-label>
            <textarea matInput rows="2" formControlName="remarks" [readonly]="isViewMode"></textarea>
          </mat-form-field>
        </div>
      </div>
      <mat-divider></mat-divider>
      <div class="button-container">
        <button *ngIf="!isViewMode" mat-flat-button color="success" type="button" (click)="saveData()" [disabled]="isLoading">Save</button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">Close</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
