<mat-card>
  <mat-card-header>
    <mat-card-title>Delete Donation</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <div class="row">
      <div class="col-md-12">
        <mat-form-field style="width: 100%;">
          <mat-label>Donor</mat-label>
          <input matInput [value]="data.element.bloodDonor?.name" type="text" readonly>
        </mat-form-field>
      </div>
      <div class="col-md-12">
        <mat-form-field style="width: 100%;">
          <mat-label>Component Type</mat-label>
          <input matInput [value]="data.element.bloodComponentType?.name" type="text" readonly>
        </mat-form-field>
      </div>
      <div class="col-md-12">
        <mat-form-field style="width: 100%;">
          <mat-label>Donation Date</mat-label>
          <input matInput [value]="data.element.donationDate | date:'dd-MMM-yyyy'" type="text" readonly>
        </mat-form-field>
      </div>
    </div>
    <mat-divider></mat-divider>
    <div class="button-container">
      <button mat-flat-button color="danger" type="button" (click)="delete()">
        <span class="mat-button-wrapper">Delete</span>
      </button>
      <button mat-flat-button color="default" [mat-dialog-close]="true">
        <span class="mat-button-wrapper">Close</span>
      </button>
    </div>
  </mat-card-content>
</mat-card>
