<mat-card>
  <mat-card-header><mat-card-title>{{ dialogTitle }}</mat-card-title></mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content *ngIf="!isLoading">
    <form [formGroup]="form">
      <div class="row">
        <div class="col-md-12" *ngIf="selectedRequest">
          <mat-form-field style="width: 100%;">
            <mat-label>Blood Request</mat-label>
            <input matInput [value]="getRequestLabel()" type="text" readonly>
          </mat-form-field>
        </div>
        <div class="col-md-12" *ngIf="selectedRequest">
          <mat-form-field style="width: 100%;">
            <mat-label>Group | Component | Qty</mat-label>
            <input matInput [value]="getRequestDetailsLabel()" type="text" readonly>
          </mat-form-field>
        </div>
        <div class="col-md-12" *ngIf="selectedUnit">
          <mat-form-field style="width: 100%;">
            <mat-label>Blood Unit</mat-label>
            <input matInput [value]="getUnitLabel()" type="text" readonly>
          </mat-form-field>
        </div>
        <div class="col-md-6" *ngIf="crossMatchDate">
          <mat-form-field style="width: 100%;">
            <mat-label>Cross Match Date</mat-label>
            <input matInput [value]="crossMatchDate | date:'dd-MMM-yy'" type="text" readonly>
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field style="width: 100%;">
            <mat-label>Issue Date</mat-label>
            <input matInput [matDatepicker]="issueDatePicker" formControlName="issueDate"
              placeholder="DD/MM/YYYY" [readonly]="mode === 'view'">
            <mat-datepicker-toggle matIconSuffix [for]="issueDatePicker" *ngIf="mode !== 'view'"></mat-datepicker-toggle>
            <mat-datepicker #issueDatePicker></mat-datepicker>
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field style="width: 100%;">
            <mat-label>Issued To</mat-label>
            <input matInput formControlName="issuedTo" type="text" maxlength="100" [readonly]="mode === 'view'">
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field style="width: 100%;">
            <mat-label>Remarks</mat-label>
            <textarea matInput rows="2" formControlName="remarks" [readonly]="mode === 'view'"></textarea>
          </mat-form-field>
        </div>
      </div>
      <mat-divider></mat-divider>
      <div class="button-container">
        <button *ngIf="mode !== 'view'" mat-flat-button color="success" type="button" (click)="saveData()" [disabled]="isLoading">Save</button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">Close</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
