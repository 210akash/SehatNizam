<mat-card>
  <mat-card-header>
    <mat-card-title>Return to Cross Match</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <p class="confirm-text">
      Cross match result will be cleared and this request will return to the <strong>Blood Cross Match</strong> queue.
      The assigned unit will be released. History will be preserved in the request log.
    </p>
    <div class="row">
      <div class="col-md-12">
        <mat-form-field style="width: 100%;">
          <mat-label>Request</mat-label>
          <input matInput [value]="data.element?.bloodRequest?.code" type="text" readonly>
        </mat-form-field>
      </div>
      <div class="col-md-12">
        <mat-form-field style="width: 100%;">
          <mat-label>Patient</mat-label>
          <input matInput [value]="data.element?.bloodRequest?.patientName" type="text" readonly>
        </mat-form-field>
      </div>
      <div class="col-md-12">
        <mat-form-field style="width: 100%;">
          <mat-label>Unit</mat-label>
          <input matInput [value]="data.element?.bloodUnit?.unitNo" type="text" readonly>
        </mat-form-field>
      </div>
    </div>
    <mat-divider></mat-divider>
    <div class="button-container">
      <button mat-flat-button color="warn" type="button" (click)="confirm()" [disabled]="isLoading">Return to Cross Match</button>
      <button mat-flat-button color="default" [mat-dialog-close]="true">Cancel</button>
    </div>
  </mat-card-content>
</mat-card>
