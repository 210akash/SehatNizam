<form [formGroup]="departmentForm">
<mat-card>
  <mat-card-header>
             <div class="header-container">
    <mat-card-title>Add Department</mat-card-title>
          <mat-label>{{this.departmentForm.get('clinical')?.value ? 'Clinical' : 'Non-Clinical'}} </mat-label>
         <mat-slide-toggle [matTooltip]="this.departmentForm.get('clinical')?.value ? 'Clinical' : 'Non-Clinical'"
            formControlName="clinical" color="primary">
          </mat-slide-toggle>
    </div>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
      <input type="hidden" formControlName="id" />
      <div class="row">
      <div class="col-md-12">
      <mat-form-field style="width: 100%;">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" type="text">
      </mat-form-field>
    </div>
      <div class="col-md-12">
      <mat-form-field style="width: 100%;">
        <mat-label>Description</mat-label>
        <textarea matInput rows="2" formControlName="description">
        </textarea>
      </mat-form-field>
    </div>
     <div class="col-md-6">
     
        </div>
      <!-- <div class="col-md-12"  >
        <mat-form-field class="form-field" >
          <mat-label>Company</mat-label>
          <mat-select formControlName="companyId">
            <mat-option *ngFor="let company of companyList" [value]="company.id">
              {{ company.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div> -->
    </div>
    <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="success" type="button" (click)="SaveData()">
          <span class="mat-button-wrapper">Save</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</form>
