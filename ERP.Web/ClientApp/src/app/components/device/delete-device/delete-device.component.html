<form [formGroup]="deleteDeviceForm">
<mat-card>
  <mat-card-header>
      <div class="header-container">
        <mat-card-title>Delete Device</mat-card-title>
        <mat-slide-toggle matTooltip="Active" formControlName="isActive" color="primary" readonly></mat-slide-toggle>
      </div>
    </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content>

      <div class="card-body">
     <div class="row">
        <div class="col-md-6">
          <div class="mb-2">
            <mat-form-field class="example-full-width">
              <mat-label>Device Name</mat-label>
              <input matInput placeholder="Device Name" formControlName="name" />
            </mat-form-field>
          </div>
        </div>
          <div class="col-md-4">
          <div class="mb-2">
            <mat-form-field class="example-full-width">
              <mat-label>IP Address</mat-label>
              <input matInput placeholder="IP Address" formControlName="iPAddress" />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-2">
          <div class="mb-2">
            <mat-form-field class="example-full-width">
              <mat-label>Port</mat-label>
              <input matInput type="number" min="0" placeholder="Port" formControlName="port" />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-2">
            <mat-form-field class="example-full-width">
              <mat-label>Phone No</mat-label>
              <input matInput placeholder="Phone No" formControlName="phoneNo" />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-2">
            <mat-form-field class="example-full-width">
              <mat-label>Location</mat-label>
              <textarea matInput placeholder="Address" rows="2" formControlName="address">
              </textarea>
            </mat-form-field>
          </div>
        </div>
      </div>
      </div>
      <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="danger" type="button" (click)="delete()">
          <span class="mat-button-wrapper">Delete</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
  </mat-card-content>
</mat-card>
    </form>
