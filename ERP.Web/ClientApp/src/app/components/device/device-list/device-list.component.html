<div class="header-container">
  <h2>Device</h2>
  <button mat-mini-fab aria-label="Add" color="success" (click)="openDeviceDialog(null)" matTooltip="Add Device">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="body-container">
  <form [formGroup]="deviceListFilerForm" class="form-horizontal form-label-left">
    <div class="row">

      <div class="col-md-3">
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput placeholder="Name" formControlName="name" (keyup)="filterData()" />
        </mat-form-field>
      </div>

      <div class="col-md-3">
        <mat-form-field>
          <mat-label>Is Active</mat-label>
          <mat-select formControlName="isActive" (selectionChange)="filterData()">
            <mat-option [value]="null">-- ALL --</mat-option>
            <mat-option [value]="true">-- Yes --</mat-option>
            <mat-option [value]="false">-- No --</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </form>

  <div class="mat-elevation-z8 table-responsive mt-2">
    <table mat-table [dataSource]="dataSource" matSort>
      <!--Name Column-->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="text-dark"> Device</th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <!--Description Column-->
      <ng-container matColumnDef="ipAddress">
        <th mat-header-cell *matHeaderCellDef class="text-dark"> IP Address</th>
        <td mat-cell *matCellDef="let element"> {{element.ipAddress}} </td>
      </ng-container>

            <ng-container matColumnDef="port">
        <th mat-header-cell *matHeaderCellDef class="text-dark"> Port</th>
        <td mat-cell *matCellDef="let element"> {{element.port}} </td>
      </ng-container>

      <ng-container matColumnDef="createdBy">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> CreatedBy </th>
        <td mat-cell *matCellDef="let element"> {{ element.createdBy?.firstName }} </td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by Active"> Active </th>
        <td mat-cell *matCellDef="let element">
          <mat-slide-toggle [(ngModel)]="element.isActive" readonly
            [matTooltip]="element?.isActive == true ? 'Active' : 'Not Active'" disabled color="success">
          </mat-slide-toggle>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef style="width: 11%;"> Actions </th>
        <td mat-cell *matCellDef="let element">
          <div class="action_btns">
            <button mat-mini-fab matTooltip="Edit" color="primary" (click)="openDeviceDialog(element)">
              <mat-icon aria-label="Edit">edit</mat-icon>
            </button>

            <button mat-mini-fab matTooltip="View" color="dark" (click)="openViewDeviceDialog(element)">
              <mat-icon aria-label="View">visibility</mat-icon>
            </button>

            <button mat-mini-fab matTooltip="Delete" color="warn" (click)="openDeleteDialog(element)">
              <mat-icon aria-label="Delete">delete</mat-icon>
            </button>

              <button mat-mini-fab matTooltip="Sync" color="success" (click)="openDeleteDialog(element)">
              <mat-icon aria-label="Sync">sync</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns;  sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator #paginator [length]="totalRows" [pageIndex]="currentPage" [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions" (page)="pageChanged($event)" aria-label="Select page">
    </mat-paginator>
  </div>
</div>
