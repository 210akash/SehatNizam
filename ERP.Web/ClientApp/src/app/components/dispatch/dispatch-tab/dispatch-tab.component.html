<div class="header-container">
  <h2>Dispatch</h2>
  <div>
    <button mat-mini-fab color="primary" matTooltip="Orders to be dispatched List"
      (click)="openPendingOrderListDialog()">
      <mat-icon>list</mat-icon>
    </button>
    <button style="margin-left: 5px;" mat-mini-fab aria-label="Add" color="success" *ngIf="!roleList?.includes('audit')" (click)="opendispatchDialog(null)" matTooltip="Add Dispatch">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>
<div class="body-container">
  <form [formGroup]="dispatchFilterForm">
    <div class="row">
      <div class="col-lg-2 col-md-3">
        <div class="mt-2">
          <mat-form-field class="form-field">
            <mat-label>From Date</mat-label>
            <input matInput [matDatepicker]="fdate" formControlName="fdate" (keyup)="filterData()">
            <mat-datepicker-toggle matIconSuffix [for]="fdate"></mat-datepicker-toggle>
            <mat-datepicker #fdate></mat-datepicker>
          </mat-form-field>
        </div>
      </div>
      <div class="col-lg-2 col-md-3">
        <div class="mt-2">
          <mat-form-field class="form-field">
            <mat-label>To Date</mat-label>
            <input matInput [matDatepicker]="tdate" formControlName="tdate" (keyup)="filterData()">
            <mat-datepicker-toggle matIconSuffix [for]="tdate"></mat-datepicker-toggle>
            <mat-datepicker #tdate></mat-datepicker>
          </mat-form-field>
        </div>
      </div>
       <div class="col-lg-1 col-md-2">
        <div class="mt-2">
          <mat-form-field class="form-field">
            <mat-label>Code</mat-label>
            <input matInput formControlName="code" (keyup)="filterData()">
          </mat-form-field>
          </div>
      </div>
        <div class="col-lg-3 col-md-4">
              <div class="mt-2">
            <mat-form-field>
                    <mat-label>Distributor</mat-label>
                    <input matInput formControlName="dealershipName" [matAutocomplete]="auto"
                      (keyup)="getDealershipsList($event);" class="form-control" (input)="onInputCleared($event)"
                      type="search" />
                    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onOptionDealershipSelected($event)">
                      <mat-option *ngFor="let distributor of dealershipList" [value]="distributor">
                        {{ distributor?.name }} | {{distributor?.dealershipType.name}} | {{ distributor?.territory?.name }} | {{ distributor?.address }}
                      </mat-option>
                    </mat-autocomplete>
                  </mat-form-field>
                  </div>
        </div>
          <div class="col-lg-2 col-md-3">
              <div class="mt-2">
          <mat-form-field class="form-field" style="width:80%;">
            <mat-label>Order Id</mat-label>
            <input matInput formControlName="orderId" (keyup)="filterData()">
          </mat-form-field>
          </div>
      </div>
      <div class="col-lg-1 col-md-1">
          <div class="mt-2">
          <button mat-mini-fab color="primary" matTooltip="Reset Filters" (click)="resetForm()">
            <mat-icon>refresh</mat-icon>
          </button>
          </div>
      </div>
    </div>
  </form>
  <mat-divider></mat-divider>
  <div class="table-responsive mt-3">
    <mat-tab-group [selectedIndex]="selected.value" (selectedIndexChange)="selected.setValue($event)"
      (selectedTabChange)="changeTab($event)">
      <mat-tab *ngFor="let tab of tabs; let index = index" [label]="tab.posessionStatusValues" value="tab.id">
        <ng-template style="padding-top: 8px; padding-left: 3px;" mat-tab-label>
          <span id="tabHeading">
            {{tab.posessionStatusValues}} <span id="spn_pCounts">({{tab.pCount}})</span>
          </span>
        </ng-template>
      </mat-tab>
    </mat-tab-group>

    <app-dispatch-list (onPopupClose)="onPopupClose()" (getdispatchCount)="getdispatchCount()"></app-dispatch-list>
  </div>
</div>
