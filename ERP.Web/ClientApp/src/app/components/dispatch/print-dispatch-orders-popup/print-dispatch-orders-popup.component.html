<div class="card">
    <div class="card-header">
        <div class="header-container">
            <div class="card-title">Print Orders Dispatch</div>
        </div>
    </div>
    <div class="card-body">
        <div class="container">
            <div class="col-lg-12 col-md-12 col-sm-12">
                <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12">
                        <div class="order-prints-container">
                            <div *ngFor="let doc of ordersPrint; let formsIndex = index" class="order-print-item">
                                <strong class="order-dealer-name">{{ doc.order.dealership?.name }}</strong>
                                    <mat-divider></mat-divider>
                                <div class="col-md-12 mt-2">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="file-upload text-center document-wrap"
                                                 (click)="openReceiptPrint(doc.orderId)">
                                                <div class="fa fa-file-text-o fa-3x document-icon"></div>
                                                <div class="mt-2 document-name">Dispatch Note</div>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="file-upload text-center document-wrap"
                                                 (click)="openInvoicePrint(doc.orderId)">
                                                <div class="fa fa-file-text-o fa-3x document-icon"></div>
                                                <div class="mt-2 document-name">Sale Invoice</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
    <div class="card-footer">
        <div class="button-container m-0">
            <button mat-flat-button color="default" [mat-dialog-close]="true">
                <span class="mat-button-wrapper">Close</span>
            </button>
        </div>
    </div>
</div>
