<mat-card>
    <mat-card-header>
      <div class="header-container">
        <mat-card-title>Voucher Documents</mat-card-title>
      </div>
      <div class="button-container">
        <button mat-mini-fab color="danger" [mat-dialog-close]="true">
          <mat-icon class="m-0">close</mat-icon>
        </button>
      </div>
    </mat-card-header>
  
    <mat-divider></mat-divider>
  
    <mat-card-content>
      <div class="w-100 d-inline-block text-center">
      <ng-container [ngSwitch]="fileType">
        <img *ngSwitchCase="'image'" [src]="urlSafe" class="docview" />
        <iframe *ngSwitchCase="'pdf'" width="100%" height="600px" frameBorder="0" [src]="urlSafe"></iframe>
        <p *ngSwitchDefault>Unsupported file type or preview not available.</p>
      </ng-container>
    </div>
      <mat-divider></mat-divider>
  
      <div class="button-container">
        <button mat-flat-button color="danger" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </mat-card-content>
  </mat-card>
