<mat-card>
  <mat-card-header>
    <mat-card-title>Delete Employee Leave Type</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>

    <form [formGroup]="employeeLeaveTypeForm" >
      <input type="hidden" formControlName="id" />
      <div class="row">
       <div class="col-md-3">
          <mat-form-field style="width: 100%;">
            <mat-label>Code</mat-label>
            <input matInput formControlName="code" type="text">
          </mat-form-field>
        </div>
        <div class="col-md-9">
          <mat-form-field style="width: 100%;">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" type="text">
          </mat-form-field>
        </div>
      
    </div>
      <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="danger" type="button" (click)="delete()">
          <span class="mat-button-wrapper">Delete</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </form>

  </mat-card-content>
</mat-card>
