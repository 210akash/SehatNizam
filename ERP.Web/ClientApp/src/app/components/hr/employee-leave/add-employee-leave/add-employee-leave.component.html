<form [formGroup]="employeeLeaveForm" class="leave-apply-container">
  <!-- Header Section -->
  <header class="apply-header">
    <div class="header-main">
      <div class="header-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
      </div>
      <div class="header-text">
        <h1>Apply for Leave</h1>
        <p class="sub-label">Submit your request for supervisor approval</p>
      </div>
    </div>
  </header>

  <div class="apply-body">
    <!-- Leave Type & Balance Row -->
    <section class="type-balance-row">
      <div class="type-selection">
        <label class="section-label">Select Leave Type</label>
        <div class="radio-grid">
          <label *ngFor="let balance of leaveBalance" class="custom-radio">
            <input type="radio" [value]="balance.id" formControlName="employeeGroupLeaveTypeDetailId" />
            <span class="radio-card">
              <span class="radio-label">{{ balance.leaveType }}</span>
              <span class="radio-sub">Bal: {{balance.balance}}</span>
            </span>
          </label>
        </div>
      </div>

      <div class="balance-mini-table">
        <label class="section-label">Current Balance</label>
        <div class="table-wrapper">
          <table class="compact-table">
            <thead>
              <tr>
                <th>Type</th>
                <th class="text-center">Allotted</th>
                <th class="text-center">Used</th>
                <th class="text-center">Bal</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of leaveBalance">
                <td class="font-semibold">{{ item.leaveType }}</td>
                <td class="text-center">{{ item.allotted }}</td>
                <td class="text-center">{{ item.used }}</td>
                <td class="text-center font-bold text-primary">{{ item.balance }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Schedule Section -->
    <section class="schedule-section">
      <div class="schedule-grid">
        <!-- Start Date Card -->
        <div class="date-input-card">
          <div class="card-top">
            <label>Start Date</label>
            <mat-checkbox formControlName="isFirstHalfDay" class="toggle-chip">Half Day</mat-checkbox>
          </div>
          <input type="date" formControlName="startDate" class="clean-date-input">
        </div>

        <!-- End Date Card -->
        <div class="date-input-card">
          <div class="card-top">
            <label>End Date</label>
            <mat-checkbox formControlName="isLastHalfDay" class="toggle-chip">Half Day</mat-checkbox>
          </div>
          <input type="date" formControlName="endDate" class="clean-date-input">
        </div>

        <!-- Duration Card -->
        <div class="duration-display">
          <label>Total Days</label>
          <div class="days-val">{{this.employeeLeaveForm.get('noOfDays')?.value}}</div>
        </div>
      </div>
    </section>

    <!-- Reason Section -->
    <section class="reason-section">
      <mat-form-field appearance="outline" class="compact-field full-width">
        <mat-label>Reason for Leave</mat-label>
        <textarea matInput formControlName="reason" rows="2" placeholder="Briefly explain why you are taking leave..."></textarea>
      </mat-form-field>
    </section>
  </div>

  <!-- Footer Actions -->
  <footer class="apply-actions">
    <button  mat-flat-button color="default" type="button" [mat-dialog-close]="true">Close</button>
    <button class="btn btn-primary" type="button" (click)="SaveData()" [disabled]="employeeLeaveForm.invalid">
      Submit Request
    </button>
  </footer>
</form>
