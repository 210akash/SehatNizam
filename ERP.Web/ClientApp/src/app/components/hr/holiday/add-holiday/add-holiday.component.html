<form [formGroup]="holidayForm">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Edit' : 'Create' }} Holiday Form</mat-card-title>
    </mat-card-header>
    <mat-divider></mat-divider>
    <mat-card-content>
      <input type="hidden" formControlName="id" />
      <div class="row">
          <div class="col-md-12">
            <mat-form-field>
              <mat-label>Title</mat-label>
              <input matInput formControlName="title" type="text">
            </mat-form-field>
          </div>
          <div class="col-md-12">
            <div class="mt-2">
              <mat-form-field>
                <mat-label>Date</mat-label>
                <input matInput [matDatepicker]="date" formControlName="date">
                <mat-datepicker-toggle matIconSuffix [for]="date"></mat-datepicker-toggle>
                <mat-datepicker #date></mat-datepicker>
              </mat-form-field>
            </div>
          </div>
            <div class="col-md-12">
            <mat-form-field>
              <mat-label>Description</mat-label>
              <input matInput formControlName="description" type="text">
            </mat-form-field>
          </div>
      </div>
      <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="success" type="button" (click)="SaveData()">
          <span class="mat-button-wrapper">Save</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</form>
