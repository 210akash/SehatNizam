<h2 mat-dialog-title>Delete Notification</h2>
<mat-dialog-content>
    <div class="pt-3">
        <p class="text-danger">Are you sure you want to delete this notification?</p>
        
        <div class="row">
            <div class="col-md-12 mb-2">
                <strong>Title:</strong> {{data.element?.title}}
            </div>
            <div class="col-md-12 mb-2">
                <strong>Department:</strong> {{data.element?.departmentName}}
            </div>
            <div class="col-md-12 mb-2">
                <strong>Expire Date:</strong> {{data.element?.expireDate | date:'yyyy-MM-dd'}}
            </div>
        </div>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pb-3 px-3">
    <button mat-button (click)="close()">Cancel</button>
    <button mat-raised-button color="warn" (click)="delete()" [disabled]="isLoading">
        <mat-spinner diameter="20" *ngIf="isLoading" class="me-2 d-inline-block"></mat-spinner>
        Delete
    </button>
</mat-dialog-actions>
