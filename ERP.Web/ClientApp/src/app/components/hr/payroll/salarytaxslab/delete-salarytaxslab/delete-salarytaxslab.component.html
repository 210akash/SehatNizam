<mat-card>
  <mat-card-header>
    <mat-card-title>Delete SalaryTaxSlab</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>

    <form [formGroup]="salarytaxslabForm" >
      <input type="hidden" formControlName="id" />
      <div class="row">
      <div class="col-md-12">
          <mat-form-field>
            <mat-label>From Amount</mat-label>
            <input matInput formControlName="fromAmount" type="number" readonly>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field>
            <mat-label>To Amount</mat-label>
            <input matInput formControlName="toAmount" type="number" readonly>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field>
            <mat-label>Percentage</mat-label>
            <input matInput formControlName="percentage" type="number" readonly>
          </mat-form-field>
        </div>
      
    </div>
      <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="danger" type="button" (click)="delete()">
          <span class="mat-button-wrapper">Delete</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </form>

  </mat-card-content>
</mat-card>
