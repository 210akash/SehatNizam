<form [formGroup]="userattendanceForm">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Register Device</mat-card-title>
      <mat-card-subtitle>{{ data.element.firstName + ' ' + data.element.lastName }}</mat-card-subtitle>
      <mat-card-subtitle><b>{{ data.element.employeeDesignation?.name }}</b></mat-card-subtitle>
    </mat-card-header>
    <mat-divider></mat-divider>
    <mat-card-content>
      <input type="hidden" formControlName="id" />
      <input type="hidden" formControlName="deviceId">

      <div class="row" *ngIf="this.userattendanceForm.get('deviceId')?.value !=  null">
            <div class="col-md-12">
            <mat-form-field>
             <mat-label>Request Time</mat-label>
              <input matInput [value]="this.data.element.modifiedDate | date: 'short'">
            </mat-form-field>
            </div>
       </div>
     <div class="row">
        <div class="col-md-6 mt-3">
          <mat-slide-toggle formControlName="isAvailableForMobile">
            Available for Mobile
          </mat-slide-toggle>
        </div>

        <div class="col-md-6 mt-3">
          <mat-slide-toggle formControlName="isMobileDeviceRegister"
            [disabled]="!userattendanceForm.get('isAvailableForMobile')?.value">
            Mobile Device Registered
          </mat-slide-toggle>
        </div>

        <div class="col-md-6 mt-3">
          <mat-slide-toggle formControlName="isDistCompForAtten"
            [disabled]="!userattendanceForm.get('isAvailableForMobile')?.value">
            Distance Compliance for Attendance
          </mat-slide-toggle>
        </div>

        <div class="col-md-6 mt-3">
          <mat-slide-toggle formControlName="isAvailableForWeb">
            Available for Web
          </mat-slide-toggle>
        </div>
      </div>

      <mat-divider class="mt-3"></mat-divider>

      <div class="button-container mt-3">
        <button mat-flat-button color="primary" type="button" (click)="SaveData()">
          Save
        </button>

        <button mat-flat-button color="warn" [mat-dialog-close]="true">
          Close
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</form>
