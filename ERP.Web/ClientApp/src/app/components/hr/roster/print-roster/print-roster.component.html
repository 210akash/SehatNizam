<div class="print-roster-dialog">
  <div class="actions no-print">
    <button mat-flat-button color="primary" (click)="printDocument()">Print</button>
    <button mat-flat-button color="default" (click)="close()">Close</button>
  </div>

  <div class="print-sheet" id="printDoc">
    <div class="sheet-header">
      <h2>{{ roster?.department?.name }} - Roster</h2>
      <div class="meta">
        <span><strong>Year:</strong> {{ roster?.year }}</span>
        <span><strong>Month:</strong> {{ roster?.month }}</span>
        <span><strong>Status:</strong> {{ roster?.status?.title }}</span>
      </div>
    </div>

    <div class="table-wrap">
      <table class="roster-table">
        <thead>
          <tr>
            <th class="emp-col">Employee</th>
            <th *ngFor="let day of days">{{ day }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let emp of groupedRoster">
            <td class="emp-cell">
              <div class="emp-name">{{ emp.employeeName }}</div>
              <div class="emp-code">{{ emp.employeeCode }}</div>
            </td>
            <td *ngFor="let day of days" [ngClass]="getCellClass(emp, day)">
              {{ shiftText(getRosterCell(emp, day)) }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
