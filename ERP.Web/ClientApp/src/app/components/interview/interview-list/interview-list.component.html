<div class="header-container">
  <h2>Interviews</h2>
  <button mat-mini-fab aria-label="Add" color="success" (click)="openInterviewDialog(null)" matTooltip="Add Interview">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="body-container">
  <div class="mat-elevation-z8 table-responsive">

    <table mat-table [dataSource]="dataSource" matSort>

      <!-- Columns -->
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Code </th>
        <td mat-cell *matCellDef="let element"> {{ element.code }} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
        <td mat-cell *matCellDef="let element"> {{ element.status?.title }} </td>
      </ng-container>

      <ng-container matColumnDef="createdDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Created Date </th>
        <td mat-cell *matCellDef="let element"> {{ element.createdDate | date: 'mediumDate' }} </td>
      </ng-container>

      <ng-container matColumnDef="createdBy">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Created By </th>
        <td mat-cell *matCellDef="let element"> {{ element.createdBy?.firstName }} </td>
      </ng-container>

      <!-- Actions column definition -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef style="width: 11%;"> Actions </th>
        <td mat-cell *matCellDef="let element">
          <div class="action_btns">

            <button mat-mini-fab matTooltip="Edit" color="primary" (click)="openInterviewDialog(element)">
              <mat-icon aria-label="Edit">edit</mat-icon>
            </button>
            
            <button *ngIf="element.statusId <= 2" mat-mini-fab matTooltip="Add Comments" color="primary" (click)="addCommentsDialog(element)">
              <mat-icon aria-label="Comments">add_comment</mat-icon>
            </button>            

            <button mat-mini-fab matTooltip="View" color="dark" (click)="viewInterviewDialog(element)">
              <mat-icon aria-label="View">visibility</mat-icon>
            </button>

            <button mat-mini-fab matTooltip="Delete" color="warn" (click)="deleteInterviewDialog(element)">
              <mat-icon aria-label="Delete">delete</mat-icon>
            </button>

          </div>
        </td>
      </ng-container>

      <!-- Table rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-divider></mat-divider>
    <!-- Paginator -->
    <mat-paginator #paginator [length]="totalRows" [pageIndex]="currentPage" [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions" (page)="pageChanged($event)" aria-label="Select page">
    </mat-paginator>

  </div>
</div>
