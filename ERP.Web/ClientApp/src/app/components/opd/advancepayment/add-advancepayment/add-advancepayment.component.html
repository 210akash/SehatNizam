<mat-card>
  <mat-card-header>
    <mat-card-title>Advance Payment Form</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <form [formGroup]="admissionServiceForm" class="modern-form mt-3">
      <div class="row">
        <div class="col-md-12">
          <div class="lookup-row">
            <mat-form-field class="lookup-field" appearance="outline">
              <input
                matInput
                type="search"
                placeholder="Search Booking /Scan Barcode..."
                [formControl]="appointmentSearchCtrl"
                [matAutocomplete]="appointmentAuto"
                (input)="onAppointmentInputCleared($event)" />
              <mat-autocomplete
                #appointmentAuto="matAutocomplete"
                [displayWith]="displayAppointment"
                (optionSelected)="onAppointmentSelected($event.option.value)">
                <mat-option *ngFor="let appointment of filteredAppointments$ | async" [value]="appointment">
                  Booking # {{ appointment.id || '-' }}
                  <span *ngIf="appointment.patient?.name"> - {{ appointment.patient?.name }}</span>
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>

            <button mat-flat-button color="primary" type="button" class="lookup-button" (click)="lookupAppointment()">
              Lookup
            </button>
          </div>
        </div>

        <div class="col-md-6">
          <mat-form-field appearance="outline">
            <mat-label>Amount</mat-label>
            <input type="number" matInput class="form-control" formControlName="amount" />
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field appearance="outline">
            <mat-label>Payment Mode</mat-label>
            <mat-select formControlName="paymentModeId">
              <mat-option *ngFor="let p of paymentModesList" [value]="p.id">{{ p.name }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </form>

    <div class="button-container">
      <button mat-flat-button color="primary" type="button" (click)="SaveData()">
        <span class="mat-button-wrapper">Save</span>
      </button>
      <button mat-flat-button color="warn" [mat-dialog-close]="true">
        <span class="mat-button-wrapper">Close</span>
      </button>
    </div>
  </mat-card-content>
</mat-card>
