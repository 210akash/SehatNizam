<mat-card>
  <mat-card-header>
    <mat-card-title>Confirm Advance Payment</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <input type="hidden" formControlName="id" />

        <div class="row">
      <div class="col-md-12">
        <mat-form-field style="width: 100%;">
          <mat-label>Appoinment #</mat-label>
          <input matInput [value]="this.data?.element?.appointment.tokenNumber" type="text" readonly>
        </mat-form-field>
      </div>
    <div class="col-md-6">
        <mat-form-field style="width: 100%;">
          <mat-label>Name</mat-label>
          <input matInput [value]="this.data?.element.appointment?.patient?.patientMaster?.name" type="text" readonly>
        </mat-form-field>
      </div>
      <div class="col-md-3">
        <mat-form-field style="width: 100%;">
          <mat-label>Amount</mat-label>
          <input matInput [value]="this.data?.element?.amount" type="text" readonly>
        </mat-form-field>
      </div>
      <div class="col-md-3">
        <mat-form-field style="width: 100%;">
          <mat-label>Payment Mode</mat-label>
          <input matInput [value]="this.data?.element?.paymentMode?.name" type="text" readonly>
        </mat-form-field>
      </div>
    </div>

    <div class="button-container">
      <button mat-flat-button color="primary" type="button" (click)="confirm()">
        <span class="mat-button-wrapper">Confirm</span>
      </button>
      <button mat-flat-button color="warn" [mat-dialog-close]="true">
        <span class="mat-button-wrapper">Close</span>
      </button>
    </div>
  </mat-card-content>
</mat-card>
