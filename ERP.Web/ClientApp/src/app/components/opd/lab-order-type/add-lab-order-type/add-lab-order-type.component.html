<mat-card class="dialog-card">
  <mat-card-header>
    <mat-card-title>{{ isEdit ? 'Edit Lab Order Type' : 'Add Lab Order Type' }}</mat-card-title>
    <mat-card-subtitle>Configure laboratory order type details.</mat-card-subtitle>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <form [formGroup]="form" class="dialog-form">
      <div class="form-grid">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Name *</mat-label>
        <input matInput formControlName="name" placeholder="Enter lab order type name" />
        <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Service *</mat-label>
        <mat-select formControlName="serviceId">
          <mat-option value="">Select Service</mat-option>
          <mat-option *ngFor="let svc of services" [value]="svc.id">{{ svc.name }}</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('serviceId')?.hasError('required')">Service is required</mat-error>
      </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" placeholder="Enter description" rows="3"></textarea>
      </mat-form-field>

      <div class="button-container">
        <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="isLoading">
          {{ isLoading ? 'Saving...' : (isEdit ? 'Update' : 'Save') }}
        </button>
        <button mat-stroked-button type="button" [mat-dialog-close]="true" [disabled]="isLoading">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
