<mat-card class="dialog-card">
  <mat-card-header>
    <mat-card-title>Lab Test Variables</mat-card-title>
    <mat-card-subtitle>Configure variables for the selected lab order type.</mat-card-subtitle>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <form [formGroup]="form" class="dialog-form">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Sr.#</th>
                <th>Name</th>
                <th>Unit</th>
                <th>Male Min</th>
                <th>Male Max</th>
                <th>Female Min</th>
                <th>Female Max</th>
                <th>Gender Range</th>
              </tr>
            </thead>
            <tbody formArrayName="variables">
              <tr *ngFor="let variable of variables.controls; let i = index" [formGroupName]="i">
                <td class="action-cell" style="width: 10px;">
                  <div class="action_btns">
                    <span>&#40;{{ i + 1 }}&#41;</span>
                    <mat-icon aria-label="Add" class="icons add" (click)="addVariable(i)">add</mat-icon>
                    <mat-icon aria-label="Delete" class="icons delete" (click)="removeVariable(i)">delete</mat-icon>
                  </div>
                  <input type="hidden" formControlName="id" />
                </td>

                <td>
                  <mat-form-field class="table-field" style="width: 400px;">
                    <input matInput formControlName="name" placeholder="Name" />
                  </mat-form-field>
                </td>

                <td>
                  <mat-form-field class="table-field" style="width: 100px;">
                    <input matInput formControlName="unit" placeholder="Unit" />
                  </mat-form-field>
                </td>

                <td>
                  <mat-form-field class="table-field"  style="width: 100px;">
                    <input matInput type="number" formControlName="maleMin" placeholder="M Min" />
                  </mat-form-field>
                </td>

                <td>
                  <mat-form-field class="table-field"  style="width: 100px;">
                    <input matInput type="number" formControlName="maleMax" placeholder="M Max" />
                  </mat-form-field>
                </td>

                <td>
                  <mat-form-field class="table-field"  style="width: 100px;">
                    <input matInput type="number" formControlName="femaleMin" placeholder="form Min" />
                  </mat-form-field>
                </td>

                <td>
                  <mat-form-field class="table-field"  style="width: 100px;">
                    <input matInput type="number" formControlName="femaleMax" placeholder="F Max" />
                  </mat-form-field>
                </td>

                <td class="checkbox-cell">
                  <label class="checkbox-label">
                    <input type="checkbox" formControlName="hasGenderRange" />
                    <span>Yes</span>
                  </label>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="button-container">
        <button mat-flat-button color="primary" type="button" (click)="saveLabTestVariables()" [disabled]="isLoading">
          {{ isLoading ? 'Saving...' : 'Save' }}
        </button>
        <button mat-stroked-button type="button" [mat-dialog-close]="true" [disabled]="isLoading">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
