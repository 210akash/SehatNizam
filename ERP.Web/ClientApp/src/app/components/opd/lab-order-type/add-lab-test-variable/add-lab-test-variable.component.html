<mat-card class="dialog-card">
  <mat-card-header>
    <mat-card-title>Lab Test Variables</mat-card-title>
    <mat-card-subtitle>Configure variables for the selected lab order type.</mat-card-subtitle>
  </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content>
    <form [formGroup]="form">
      <div class="variable-list" formArrayName="variables">
        <div class="variable-card" *ngFor="let variable of variables.controls; let i = index" [formGroupName]="i">
          <div class="card-head">
            <div class="var-index">Variable #{{ i + 1 }}</div>
            <div class="card-actions">
              <button mat-stroked-button color="primary" type="button" (click)="addVariable(i)">Add Below</button>
              <button mat-stroked-button color="warn" type="button" (click)="removeVariable(i)">Remove</button>
            </div>
          </div>

          <div class="field-grid">
            <mat-form-field><mat-label>Name</mat-label><input matInput formControlName="name"></mat-form-field>
            <mat-form-field><mat-label>Unit</mat-label><input matInput formControlName="unit"></mat-form-field>
            <mat-form-field>
              <mat-label>Type</mat-label>
              <mat-select formControlName="resultType">
                <mat-option [value]="1">Numeric</mat-option>
                <mat-option [value]="2">Text</mat-option>
                <mat-option [value]="3">Option</mat-option>
                <mat-option [value]="4">Boolean</mat-option>
              </mat-select>
            </mat-form-field>
            <mat-form-field><mat-label>Display Order</mat-label><input matInput type="number" formControlName="displayOrder"></mat-form-field>
            <mat-form-field><mat-label>Male Min</mat-label><input matInput type="number" formControlName="maleMin"></mat-form-field>
            <mat-form-field><mat-label>Male Max</mat-label><input matInput type="number" formControlName="maleMax"></mat-form-field>
            <mat-form-field><mat-label>Female Min</mat-label><input matInput type="number" formControlName="femaleMin"></mat-form-field>
            <mat-form-field><mat-label>Female Max</mat-label><input matInput type="number" formControlName="femaleMax"></mat-form-field>
          </div>

          <div class="range-grid">
          
          </div>

          <div class="toggle-row">
            <mat-checkbox formControlName="hasGenderRange">Has Gender Range</mat-checkbox>
          </div>

          <div class="options-wrap" *ngIf="isOptionType(i)" formArrayName="options">
            <div class="options-head">Options</div>
            <div class="option-row" *ngFor="let opt of getOptions(i).controls; let j = index" [formGroupName]="j">
              <mat-form-field class="field-option-name"><mat-label>Option</mat-label><input matInput formControlName="name"></mat-form-field>
              <mat-form-field class="field-option-order"><mat-label>Order</mat-label><input matInput type="number" formControlName="displayOrder"></mat-form-field>
              <button mat-icon-button color="warn" type="button" (click)="removeOption(i, j)" aria-label="Remove option">×</button>
            </div>
            <button mat-button type="button" (click)="addOption(i)">+ Add Option</button>
          </div>
        </div>
      </div>

      <div class="save-row">
        <button mat-stroked-button type="button" (click)="closeDialog()">Close</button>
        <button mat-raised-button color="primary" (click)="saveLabTestVariables()" [disabled]="isLoading">
          {{ isLoading ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
