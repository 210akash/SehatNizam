<mat-card class="dialog-card">
  <mat-card-header>
    <mat-card-title>Lab Test Variables</mat-card-title>
    <mat-card-subtitle>
      Configure variables for the selected lab order type.
    </mat-card-subtitle>
  </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content>
    <form [formGroup]="form">

      <div class="table-responsive">
        <table class="table table-bordered">

          <thead>
            <tr>
              <th>Sr</th>
              <th>Name</th>
              <th>Unit</th>
              <th>Type</th>
              <th>Order</th>
              <th>Male Min</th>
              <th>Male Max</th>
              <th>Female Min</th>
              <th>Female Max</th>
              <th>Gender Range</th>
              <th>Options</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody formArrayName="variables">

            <tr *ngFor="let variable of variables.controls; let i = index"
                [formGroupName]="i">

              <!-- Sr -->
              <td>{{ i + 1 }}</td>

              <!-- Name -->
              <td>
                <mat-form-field style="width: 200px;">
                  <input matInput formControlName="name" placeholder="Name">
                </mat-form-field>
              </td>

              <!-- Unit -->
              <td>
                <mat-form-field style="width: 100px;">
                  <input matInput formControlName="unit" placeholder="Unit">
                </mat-form-field>
              </td>

              <!-- Type -->
              <td>
                <mat-form-field style="width: 130px;">
                  <mat-select formControlName="resultType">

                    <mat-option [value]="1">Numeric</mat-option>
                    <mat-option [value]="2">Text</mat-option>
                    <mat-option [value]="3">Option</mat-option>
                    <mat-option [value]="4">Boolean</mat-option>

                  </mat-select>
                </mat-form-field>
              </td>

              <!-- Order -->
              <td>
                <mat-form-field style="width: 80px;">
                  <input matInput type="number" formControlName="displayOrder">
                </mat-form-field>
              </td>

              <!-- Male Min -->
              <td>
                <mat-form-field style="width: 90px;">
                  <input matInput type="number" formControlName="maleMin">
                </mat-form-field>
              </td>

              <!-- Male Max -->
              <td>
                <mat-form-field style="width: 90px;">
                  <input matInput type="number" formControlName="maleMax">
                </mat-form-field>
              </td>

              <!-- Female Min -->
              <td>
                <mat-form-field style="width: 90px;">
                  <input matInput type="number" formControlName="femaleMin">
                </mat-form-field>
              </td>

              <!-- Female Max -->
              <td>
                <mat-form-field style="width: 90px;">
                  <input matInput type="number" formControlName="femaleMax">
                </mat-form-field>
              </td>

              <!-- Gender Range -->
              <td>
                <mat-checkbox formControlName="hasGenderRange">
                  Yes
                </mat-checkbox>
              </td>

              <!-- Options -->
              <td style="min-width: 220px;">

                <div *ngIf="variable.get('resultType')?.value === 3"
                     formArrayName="options">

                  <div *ngFor="let opt of getOptions(i).controls; let j = index"
                       [formGroupName]="j"
                       style="display:flex; gap:5px; margin-bottom:5px;">

                    <mat-form-field style="width: 120px;">
                      <input matInput formControlName="name" placeholder="Option">
                    </mat-form-field>

                    <mat-form-field style="width: 60px;">
                      <input matInput type="number" formControlName="displayOrder">
                    </mat-form-field>

                  </div>

                  <button mat-button type="button" (click)="addOption(i)">
                    + Add Option
                  </button>

                </div>

              </td>

              <!-- Actions -->
              <td>
                <button mat-icon-button color="primary" (click)="addVariable(i)">
                  +
                </button>

                <button mat-icon-button color="warn" (click)="removeVariable(i)">
                  🗑
                </button>

              </td>

            </tr>

          </tbody>
        </table>
      </div>

      <div style="margin-top: 15px;">
        <button mat-raised-button color="primary"
                (click)="saveLabTestVariables()"
                [disabled]="isLoading">
          {{ isLoading ? 'Saving...' : 'Save' }}
        </button>
      </div>

    </form>
  </mat-card-content>
</mat-card>
