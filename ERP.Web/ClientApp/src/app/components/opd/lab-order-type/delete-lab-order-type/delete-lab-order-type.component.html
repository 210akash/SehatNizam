<mat-card>
  <mat-card-header>
    <mat-card-title>Delete Lab Order Type</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <div class="row">
      <div class="col-md-12">
        <mat-form-field style="width: 100%;">
          <mat-label>Name</mat-label>
          <input matInput [value]="data.element.name || '-'" readonly />
        </mat-form-field>
      </div>
      <div class="col-md-12">
        <mat-form-field style="width: 100%;">
          <mat-label>Description</mat-label>
          <textarea matInput rows="3" [value]="data.element.description || '-'" readonly></textarea>
        </mat-form-field>
      </div>
      <div class="col-md-12">
        <mat-form-field style="width: 100%;">
          <mat-label>Service</mat-label>
          <input matInput [value]="data.element.service?.name || '-'" readonly />
        </mat-form-field>
      </div>
    </div>
    <mat-divider></mat-divider>
    <div class="button-container">
      <button mat-flat-button color="danger" type="button" (click)="delete()" [disabled]="isLoading">
        <span class="mat-button-wrapper">{{ isLoading ? 'Deleting...' : 'Delete' }}</span>
      </button>
      <button mat-flat-button color="default" type="button" [mat-dialog-close]="true" [disabled]="isLoading">
        <span class="mat-button-wrapper">Close</span>
      </button>
    </div>
  </mat-card-content>
</mat-card>
