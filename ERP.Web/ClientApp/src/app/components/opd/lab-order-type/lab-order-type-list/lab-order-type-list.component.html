<mat-card>
  <mat-card-header>
    <mat-card-title>Lab Order Types</mat-card-title>
    <span style="flex:1 1 auto"></span>
    <button mat-flat-button color="primary" (click)="openAdd()">Add</button>
  </mat-card-header>
  <mat-card-content>
    <div class="filter-section">
      <mat-form-field class="filter-field">
        <mat-label>Search</mat-label>
        <input matInput formControlName="searchText" placeholder="Search by name" />
      </mat-form-field>
      <mat-form-field class="filter-field">
        <mat-label>Service</mat-label>
        <mat-select formControlName="serviceId">
          <mat-option value="">All Services</mat-option>
          <mat-option *ngFor="let svc of services" [value]="svc.id">{{ svc.name }}</mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-flat-button (click)="filterData()">Filter</button>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let e">{{ e.name }}</td>
      </ng-container>

      <ng-container matColumnDef="service">
        <th mat-header-cell *matHeaderCellDef>Service</th>
        <td mat-cell *matCellDef="let e">{{ e.serviceName || e.serviceId || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="customFields">
        <th mat-header-cell *matHeaderCellDef>Custom Fields</th>
        <td mat-cell *matCellDef="let e">
          <pre style="margin:0; max-height:60px; overflow:auto;">{{ e.customFieldsSchema }}</pre>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let e">
          <button mat-button (click)="openView(e)">View</button>
          <button mat-button (click)="openEdit(e)">Edit</button>
          <button mat-button color="warn" (click)="openDelete(e)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="dataSource.length === 0" class="text-center py-4">
      <p>No lab order types found.</p>
    </div>
  </mat-card-content>
</mat-card>
