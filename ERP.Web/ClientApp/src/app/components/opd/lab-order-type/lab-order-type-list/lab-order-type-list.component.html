<div class="header-container">
  <h2>Lab Order Types</h2>
  <button mat-mini-fab aria-label="Add" color="success" (click)="openAdd()" matTooltip="Add Lab Order Type">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="body-container">
  <div class="mat-elevation-z8 table-responsive">
    <div class="filter-section" [formGroup]="form">
      <mat-form-field class="filter-field">
        <mat-label>Search</mat-label>
        <input matInput formControlName="searchText" placeholder="Search by name" />
      </mat-form-field>
      <mat-form-field class="filter-field">
        <mat-label>Service</mat-label>
        <mat-select formControlName="serviceId">
          <mat-option value="">All Services</mat-option>
          <mat-option *ngFor="let svc of services" [value]="svc.id">{{ svc.name }}</mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-flat-button color="primary" type="button" (click)="filterData()">Filter</button>
    </div>

    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let e">{{ e.name }}</td>
      </ng-container>

      <ng-container matColumnDef="service">
        <th mat-header-cell *matHeaderCellDef>Service</th>
        <td mat-cell *matCellDef="let e">{{ e.serviceName || e.serviceId || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef style="width: 11%;">Actions</th>
        <td mat-cell *matCellDef="let e">
          <div class="action_btns">
            <button mat-mini-fab matTooltip="Edit" color="primary" (click)="openEdit(e)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-mini-fab matTooltip="View" color="dark" (click)="openView(e)">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-mini-fab matTooltip="Delete" color="warn" (click)="openDelete(e)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="dataSource.length === 0" class="text-center py-4">
      <p>No lab order types found.</p>
    </div>
  </div>
</div>
