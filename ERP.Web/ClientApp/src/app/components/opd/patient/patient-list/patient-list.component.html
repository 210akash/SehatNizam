
<div class="header-container">
    <h2>Patient</h2>
</div>

<div class="body-container">
    <form [formGroup]="patientListFilerForm" class="form-horizontal form-label-left">
 <div class="row">
    
    <div class="col-lg-4 col-md-3 col-sm-7 col-12">
      <mat-form-field class="filter-field" appearance="outline">
        <mat-label>Patient Name</mat-label>
        <input matInput formControlName="name" placeholder="patient name" (keyup)="filterData()" />
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>
    </div>
        <div class="col-lg-2 col-md-3 col-sm-6 col-12">
      <mat-form-field class="filter-field" appearance="outline">
        <mat-label>MRN #</mat-label>
        <input matInput formControlName="mRN" placeholder="MRN" (keyup)="filterData()" />
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>
    </div>
     <div class="col-lg-2 col-md-3 col-sm-6 col-12">
      <mat-form-field class="filter-field" appearance="outline">
        <mat-label>Phone #</mat-label>
        <input matInput formControlName="phoneNo" placeholder="phone number" (keyup)="filterData()" />
        <mat-icon matSuffix>phone</mat-icon>
      </mat-form-field>
    </div>
     <div class="col-lg-2 col-md-3 col-sm-6 col-12">
      <mat-form-field class="filter-field" appearance="outline">
        <mat-label>Cnic</mat-label>
        <input matInput formControlName="cnic" placeholder="CNIC" (keyup)="filterData()" />
        <mat-icon matSuffix>id_card</mat-icon>
      </mat-form-field>
    </div>
  </div>
    </form>

    <div class="mat-elevation-z8 table-responsive mt-2">

        <table mat-table [dataSource]="dataSource" matSort>

            <!--Name  Column-->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-dark"> Name</th>
                <td  mat-cell *matCellDef="let element"> {{element.name}} </td>
            </ng-container>

            <!--Description  Column-->
            <ng-container matColumnDef="mrn">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-dark"> MRN. No</th>
                <td  mat-cell *matCellDef="let element"> {{element.mrn}} </td>
            </ng-container>

              <!--Description  Column-->
            <ng-container matColumnDef="phoneNo">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-dark"> Phone No.</th>
                <td  mat-cell *matCellDef="let element"> {{element.phoneNo}} </td>
            </ng-container>

                <!--Description  Column-->
            <ng-container matColumnDef="project">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-dark"> Building </th>
                <td  mat-cell *matCellDef="let element"> {{element.project?.name}} </td>
            </ng-container>

            <!-- Actions column definition -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef style="width: 11%;"> Actions </th>
                <td mat-cell  mat-cell *matCellDef="let element">
                    <div class="action_btns">

                        <button mat-mini-fab matTooltip="View" color="dark" (click)="openViewPatientDialog('3000ms', '1500ms', element)">
                            <mat-icon aria-label="View">visibility</mat-icon>
                        </button>

                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns;  sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator #paginator [length]="totalRows" [pageIndex]="currentPage" [pageSize]="pageSize"
            [pageSizeOptions]="pageSizeOptions" (page)="pageChanged($event)" aria-label="Select page">
        </mat-paginator>

    </div>
</div>
