<div class="header-container">
  <h2>Radiology Types</h2>
  <button mat-mini-fab aria-label="Add" color="success" (click)="openAdd()" matTooltip="Add Radiology Type">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="body-container">
  <div class="filter-section" [formGroup]="form">
    <div class="row align-items-end">
      <div class="col-lg-4 col-md-6 col-sm-12">
        <mat-form-field class="filter-field" appearance="outline">
          <mat-label>Search by Name</mat-label>
          <input matInput formControlName="name" placeholder="Type to search..." />
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
      </div>

      <div class="col-lg-3 col-md-6 col-sm-12">
        <mat-form-field class="filter-field" appearance="outline">
          <mat-label>Service</mat-label>
          <mat-select formControlName="serviceId" (selectionChange)="filterData()">
            <mat-option [value]="null">All Services</mat-option>
            <mat-option *ngFor="let svc of services" [value]="svc.id">{{ svc.name }}</mat-option>
          </mat-select>
          <mat-icon matSuffix>medical_services</mat-icon>
        </mat-form-field>
      </div>

      <div class="col-lg-5 col-md-12 col-sm-12 filter-actions">
        <button mat-stroked-button type="button" (click)="clearFilters()">
          <mat-icon>clear</mat-icon>
          Clear
        </button>
        <button mat-flat-button color="primary" type="button" (click)="filterData()">
          <mat-icon>filter_alt</mat-icon>
          Apply
        </button>
      </div>
    </div>
  </div>

  <div class="mat-elevation-z8 table-responsive table-wrapper">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let e">
          <span class="type-name">{{ e.name }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="serviceName">
        <th mat-header-cell *matHeaderCellDef>Service</th>
        <td mat-cell *matCellDef="let e">
          <span class="service-chip">{{ getServiceName(e) }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let e">
          <span class="status-badge" [class.active]="e.isActive" [class.inactive]="!e.isActive">
            {{ e.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef style="width: 14%;">Actions</th>
        <td mat-cell *matCellDef="let e">
          <div class="action_btns">
            <button mat-mini-fab matTooltip="View" color="dark" (click)="openView(e)">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-mini-fab matTooltip="Edit" color="primary" (click)="openEdit(e)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-mini-fab matTooltip="Delete" color="warn" (click)="openDelete(e)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="dataSource.data.length === 0" class="no-data">
      <mat-icon>inbox</mat-icon>
      <p>No radiology types found.</p>
    </div>

    <mat-paginator
      [length]="totalRecords"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25, 50, 100]"
      (page)="pageChanged($event)">
    </mat-paginator>
  </div>
</div>
