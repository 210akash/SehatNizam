<mat-card>
  <mat-card-header><mat-card-title>View Radiology Type</mat-card-title></mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field class="form-field">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" readonly />
      </mat-form-field>

      <mat-form-field class="form-field">
        <mat-label>Service</mat-label>
        <input matInput [value]="data.element?.service?.name || '-'" readonly />
      </mat-form-field>

      <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button [mat-dialog-close]="true">Close</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
