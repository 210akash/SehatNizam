<mat-card>
  <mat-card-header>
    <mat-card-title>{{ isEdit ? 'Edit ServiceType' : 'Add ServiceType' }}</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <form [formGroup]="form">

      <mat-form-field class="form-field">
        <mat-label>Name *</mat-label>
        <input matInput formControlName="name" placeholder="Enter name" />
        <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
      </mat-form-field>

      <mat-form-field class="form-field">
        <mat-label>Active</mat-label>
        <mat-switch formControlName="isActive"></mat-switch>
      </mat-form-field>

      <div class="button-container">
        <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="isLoading || form.invalid">
          {{ isEdit ? 'Update' : 'Save' }}
        </button>
        <button mat-flat-button [mat-dialog-close]="true">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
