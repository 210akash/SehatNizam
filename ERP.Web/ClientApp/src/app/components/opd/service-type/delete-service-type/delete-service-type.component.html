<mat-card>
  <mat-card-header>
    <mat-card-title>Delete Service Type</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
      <div class="row justify-content-center">
        <div class="col-md-3">
          <mat-form-field style="width: 100%;">
            <mat-label>Name</mat-label>
          <input matInput [value]="this.data.element.name" type="text" readonly class="text-center">
          </mat-form-field>
        </div>
      </div>
      <p>Are you sure you want to delete this service type?</p>
      <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="danger" type="button" (click)="delete()">
          <span class="mat-button-wrapper">Delete</span>
        </button>
        <button mat-flat-button [mat-dialog-close]="true">Cancel</button>
      </div>
  </mat-card-content>
</mat-card>
