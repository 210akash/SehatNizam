<div class="header-container">
  <h2>Service Types</h2>
  <button mat-mini-fab aria-label="Add" color="success" (click)="openAdd()" matTooltip="Add Service Type">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="body-container">
  <div class="filter-section" [formGroup]="form">
    <div class="row">
      <div class="col-lg-3 col-md-4 col-sm-6 col-12">
        <mat-form-field class="filter-field" appearance="outline">
          <mat-label>Search</mat-label>
          <input matInput formControlName="searchText" placeholder="Search by name" />
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
      </div>
    </div>
  </div>
</div>

<div class="mat-elevation-z8 table-responsive">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let e">{{ e.name }}</td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Active</th>
      <td mat-cell *matCellDef="let e">
        <span [class]="e.isActive ? 'badge badge-success' : 'badge badge-danger'">
          {{ e.isActive ? 'Active' : 'Inactive' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef style="width: 15%;">Actions</th>
      <td mat-cell *matCellDef="let e">
        <div class="action_btns">
          <button mat-mini-fab matTooltip="View" color="primary" (click)="openView(e)">
            <mat-icon aria-label="View">visibility</mat-icon>
          </button>
          <button mat-mini-fab matTooltip="Edit" color="accent" (click)="openEdit(e)">
            <mat-icon aria-label="Edit">edit</mat-icon>
          </button>
          <button mat-mini-fab matTooltip="Delete" color="warn" (click)="openDelete(e)">
            <mat-icon aria-label="Delete">delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-divider></mat-divider>

  <mat-paginator
    #paginator
    [length]="totalRows"
    [pageIndex]="currentPage"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="pageChanged($event)"
    aria-label="Select page">
  </mat-paginator>
</div>
