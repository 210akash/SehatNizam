<mat-card>
  <mat-card-header>
    <mat-card-title>View Service Type</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <form [formGroup]="form">
      <div class="row">
        <div class="col-md-12">
          <mat-form-field class="form-field">
            <mat-label>Name</mat-label>
            <input matInput [value]="this.data.element.name" type="text" readonly class="text-center">
          </mat-form-field>
        </div>
      </div>
      <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button [mat-dialog-close]="true">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
