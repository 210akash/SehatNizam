<mat-card>
  <mat-card-header>
    <mat-card-title>{{ isEdit ? 'Edit Service' : 'Add Service' }}</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field class="form-field">
        <mat-label>Code *</mat-label>
        <input matInput formControlName="code" placeholder="Enter code" />
        <mat-error *ngIf="form.get('code')?.hasError('required')">Code is required</mat-error>
      </mat-form-field>

      <mat-form-field class="form-field">
        <mat-label>Name *</mat-label>
        <input matInput formControlName="name" placeholder="Enter name" />
        <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
      </mat-form-field>

      <mat-form-field class="form-field">
        <mat-label>Base Price *</mat-label>
        <input matInput formControlName="basePrice" type="number" placeholder="Enter base price" />
        <mat-error *ngIf="form.get('basePrice')?.hasError('required')">Base price is required</mat-error>
        <mat-error *ngIf="form.get('basePrice')?.hasError('min')">Base price must be non-negative</mat-error>
      </mat-form-field>

      <mat-form-field class="form-field">
        <mat-label>Department</mat-label>
        <mat-select formControlName="departmentId">
          <mat-option value="">Select Department</mat-option>
          <mat-option *ngFor="let dept of departments" [value]="dept.id">{{ dept.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="form-field">
        <mat-label>Active</mat-label>
        <mat-switch formControlName="isActive"></mat-switch>
      </mat-form-field>

      <div class="button-container">
        <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="isLoading || form.invalid">
          {{ isEdit ? 'Update' : 'Save' }}
        </button>
        <button mat-flat-button [mat-dialog-close]="true">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
