<mat-card>
  <mat-card-header>
    <mat-card-title>
        <mat-icon aria-label="Delete">delete</mat-icon>
      Delete Service</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
      <div class="row justify-content-center">
        <div class="col-md-3">
          <mat-form-field style="width: 100%;">
            <mat-label>Code</mat-label>
          <input matInput [value]="this.data.element.code" type="text" readonly class="text-center">
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
           <mat-form-field style="width: 100%;">
            <mat-label>Service Type</mat-label>
            <input matInput [value]="this.data.element.serviceType?.name" type="text" readonly>
          </mat-form-field>
        </div>
         <div class="col-md-6">
           <mat-form-field style="width: 100%;">
            <mat-label>Department</mat-label>
            <input matInput [value]="this.data.element.department?.name" type="text" readonly>
          </mat-form-field>
        </div>
       
        <div class="col-md-6">
          <mat-form-field class="form-field">
            <mat-label>Name</mat-label>
              <input matInput [value]="this.data.element.name" type="text" readonly class="text-center">
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field class="form-field">
            <mat-label>Base Price</mat-label>
              <input matInput [value]="this.data.element.basePrice" type="text" readonly class="text-center">
          </mat-form-field>
        </div>
         <div class="col-md-12">
      <mat-form-field>
        <mat-label>Description</mat-label>
        <textarea matInput rows="2"  [value]="this.data.element.description"  readonly>
        </textarea>
      </mat-form-field>
          </div>
      </div>
      <mat-divider></mat-divider>
      <div class="button-container">
          <button mat-stroked-button
              (click)="delete()"
               color="danger"
                [mat-dialog-close]="true"
                type="button">
          <i class="fas fa-trash"></i> Delete
        </button>

           <button mat-stroked-button
                [mat-dialog-close]="true"
                type="button">
          <i class="fas fa-times"></i> Cancel
        </button>
      </div>
  </mat-card-content>
</mat-card>
