<mat-card>
  <mat-card-header><mat-card-title>Delete Service</mat-card-title></mat-card-header>
  <mat-card-content>
    <p>Are you sure you want to delete this service?</p>
    <div class="button-container">
      <button mat-flat-button color="warn" (click)="delete()">Delete</button>
      <button mat-flat-button [mat-dialog-close]="true">Cancel</button>
    </div>
  </mat-card-content>
</mat-card>
