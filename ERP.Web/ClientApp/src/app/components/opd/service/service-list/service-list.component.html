<mat-card>
  <mat-card-header>
    <mat-card-title>Services</mat-card-title>
    <span style="flex:1 1 auto"></span>
    <button mat-flat-button color="primary" (click)="openAdd()">Add</button>
  </mat-card-header>
  <mat-card-content>
    <div class="filter-section">
      <mat-form-field class="filter-field">
        <mat-label>Search</mat-label>
        <input matInput formControlName="searchText" placeholder="Search by name or code" />
      </mat-form-field>
      <mat-form-field class="filter-field">
        <mat-label>Department</mat-label>
        <mat-select formControlName="departmentId">
          <mat-option value="">All Departments</mat-option>
          <mat-option *ngFor="let dept of departments" [value]="dept.id">{{ dept.name }}</mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-flat-button (click)="filterData()">Filter</button>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let e">{{ e.code }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let e">{{ e.name }}</td>
      </ng-container>

      <ng-container matColumnDef="basePrice">
        <th mat-header-cell *matHeaderCellDef>Base Price</th>
        <td mat-cell *matCellDef="let e">{{ e.basePrice | currency:'USD':true:'1.2-2' }}</td>
      </ng-container>

      <ng-container matColumnDef="departmentName">
        <th mat-header-cell *matHeaderCellDef>Department</th>
        <td mat-cell *matCellDef="let e">{{ e.departmentName || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Active</th>
        <td mat-cell *matCellDef="let e">
          <span [class]="e.isActive ? 'badge badge-success' : 'badge badge-danger'">
            {{ e.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let e">
          <button mat-button (click)="openView(e)">View</button>
          <button mat-button (click)="openEdit(e)">Edit</button>
          <button mat-button color="warn" (click)="openDelete(e)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
     </table>

     <div *ngIf="dataSource.length === 0" class="text-center py-4">
       <p>No services found.</p>
     </div>
  </mat-card-content>
</mat-card>
