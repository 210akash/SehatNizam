<mat-card>

  <mat-card-header>
    <mat-card-title>
      Service Account Setup (Project Wise)
    </mat-card-title>
  </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content>

    <form [formGroup]="form">

      <!-- SERVICE INFO -->
      <div class="row">
        <div class="col-md-3">
          <mat-form-field class="form-field">
            <mat-label>Code</mat-label>
            <input matInput formControlName="code" readonly>
          </mat-form-field>
        </div>

        <div class="col-md-3">
          <mat-form-field class="form-field">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" readonly>
          </mat-form-field>
        </div>

        <div class="col-md-3">
          <mat-form-field class="form-field">
            <mat-label>Base Price</mat-label>
            <input matInput formControlName="basePrice" readonly>
          </mat-form-field>
        </div>

        <div class="col-md-3">
          <mat-form-field class="form-field">
            <mat-label>Department</mat-label>
            <mat-select formControlName="departmentId" [disabled]="true">
              <mat-option *ngFor="let dept of departments" [value]="dept.id">{{ dept.name }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>

      <mat-form-field class="form-field">
        <mat-label>Service Type</mat-label>
        <mat-select formControlName="serviceTypeId" [disabled]="true">
          <mat-option *ngFor="let type of serviceTypes" [value]="type.id">{{ type.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-divider></mat-divider>

      <!-- PROJECT LOOP -->
      <div formArrayName="projects">

<div *ngFor="let project of projectsFA.controls; let p = index"
              [formGroupName]="p"
              class="project-box">

          <h3>{{ project.value.projectName }}</h3>

          <!-- SERVICE ACCOUNTS -->
          <div formArrayName="serviceAccounts">

            <div *ngFor="let row of getServiceAccounts(p).controls; let r = index"
                  [formGroupName]="r"
                  class="row align-items-center mb-2">

              <!-- TYPE -->
              <div class="col-md-2">
                <b *ngIf="row.value.accountType === 1">Payable *</b>
                <span *ngIf="row.value.accountType === 2">Discount</span>
              </div>

              <!-- DEBIT -->
              <div class="col-md-5">

                <mat-form-field class="form-field">

                  <input matInput
                         formControlName="debitAccountName"
                         placeholder="Debit Account"
                         (keyup)="getAccountList($event)"
                         [matAutocomplete]="autoD">

                  <mat-autocomplete #autoD="matAutocomplete"
                                    (optionSelected)="onDebitSelected($event, p, r)">
                    <mat-option *ngFor="let acc of accountList" [value]="acc">
                      {{ acc.code }} : {{ acc.name }}
                    </mat-option>
                  </mat-autocomplete>

                </mat-form-field>

              </div>

              <!-- CREDIT -->
              <div class="col-md-5">

                <mat-form-field class="form-field">

                  <input matInput
                         formControlName="creditAccountName"
                         placeholder="Credit Account"
                         (keyup)="getAccountList($event)"
                         [matAutocomplete]="autoC">

                  <mat-autocomplete #autoC="matAutocomplete"
                                    (optionSelected)="onCreditSelected($event, p, r)">
                    <mat-option *ngFor="let acc of accountList" [value]="acc">
                      {{ acc.code }} : {{ acc.name }}
                    </mat-option>
                  </mat-autocomplete>

                </mat-form-field>

              </div>

            </div>

          </div>

        </div>

      </div>

      <mat-divider></mat-divider>

      <!-- SAVE -->
      <div class="button-container mt-3">

        <button mat-flat-button color="primary"
                type="button"
                (click)="save()"
                [disabled]="isLoading || form.invalid">
          Save
        </button>

        <button mat-flat-button [mat-dialog-close]="true">
          Cancel
        </button>

      </div>

    </form>

  </mat-card-content>

</mat-card>
