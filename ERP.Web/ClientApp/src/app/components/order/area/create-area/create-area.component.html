<mat-card>
  <mat-card-header>
    <mat-card-title>Area Form</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>

    <form [formGroup]="createAreaForm">
      <div class="row">
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field>
              <mat-label>Region</mat-label>
              <mat-select formControlName="regionId"
                (selectionChange)="getZonesByRegionId();onRegionChange($event.value)">
                <mat-option [value]=0>-- Select --</mat-option>
                <mat-option *ngFor="let option of regionList" [value]="option.id">{{option.name}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field>
              <mat-label>Zone</mat-label>
              <mat-select formControlName="zoneId" (selectionChange)="onZoneChange($event.value)">
                <mat-option [value]=0>-- Select --</mat-option>
                <mat-option *ngFor="let option of zoneList" [value]="option.id">{{option.name}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field class="form-field">
              <mat-label>Name</mat-label>
              <input matInput placeholder="Name" formControlName="name" />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field class="form-field">
              <mat-label>Description</mat-label>
              <textarea matInput placeholder="Description" rows="4" formControlName="description">
                </textarea>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <mat-form-field class="form-field">
            <mat-label>Coordinates</mat-label>
            <textarea matInput placeholder="Coordinates" rows="4" formControlName="coordinates" readonly>
                </textarea>
          </mat-form-field>
        </div>

        <div class="col-md-12">
          <div class="button-container">
            <button mat-flat-button color="success" (click)="drawArea()">
              <i class="fa fa-map-o"></i> Draw Area
            </button>
            <button *ngIf="isEditMode" mat-flat-button color="default" (click)="editArea()">
              <i class="fa fa-pencil-square-o"></i> Edit Area
            </button>
          </div>
        </div>
      </div>
      <mat-divider class="mt-2"></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="success" type="button" (click)="saveArea()">
          <span class="mat-button-wrapper">Save</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true" style="margin-left: 10px;">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
