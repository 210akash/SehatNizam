<form [formGroup]="userForm">
<mat-card>
  <mat-card-header>
    <div class="header-container">
      <mat-card-title>Distributor User Form</mat-card-title>
    </div>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
      <input type="hidden" formControlName="userName">
      <input type="hidden" formControlName="userId">
      <div class="row">
        <div class="col-md-12">
          <mat-form-field appearance="outline" class="form-field">
            <mat-label> Email </mat-label>
            <input matInput formControlName="email" type="text" [readonly]="isEditMode" required>
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field appearance="outline" class="form-field">
            <mat-label> Password </mat-label>
            <input matInput formControlName="password" [type]="PasswordNew ? 'text' : 'password'" required>
            <mat-icon matSuffix (click)="PasswordVisibilityNew()">
              {{PasswordNew?'visibility':'visibility_off'}}
            </mat-icon>
          </mat-form-field>
        </div>
        <div class="col-md-12" *ngIf="userForm.get('password')?.value.length > 0">
          <div id="message">
            <h3>Password must contain the following:</h3>
            <p id="letter" [ngClass]="{'valid': passwordRequirements.hasLowerCase, 'invalid': !passwordRequirements.hasLowerCase}">
              A <b>lowercase</b> letter
            </p>
            <p id="capital" [ngClass]="{'valid': passwordRequirements.hasUpperCase, 'invalid': !passwordRequirements.hasUpperCase}">
              A <b>capital (uppercase)</b> letter
            </p>
            <p id="number" [ngClass]="{'valid': passwordRequirements.hasNumber, 'invalid': !passwordRequirements.hasNumber}">
              A <b>number</b>
            </p>
            <p id="special" [ngClass]="{'valid': passwordRequirements.hasSpecialCharacter, 'invalid': !passwordRequirements.hasSpecialCharacter}">
              A <b>special character</b> 
            </p>
            <p id="length" [ngClass]="{'valid': passwordRequirements.hasMinimumLength, 'invalid': !passwordRequirements.hasMinimumLength}">
              Minimum <b>8 characters</b>
            </p>
          </div>
        </div>
        
      </div>
      <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="primary" type="button" (click)="SaveData()">
          <span class="mat-button-wrapper">Save</span>
        </button>
        <button mat-flat-button color="warn" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</form>
