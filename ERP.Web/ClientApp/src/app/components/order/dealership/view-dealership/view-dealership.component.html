<div class="card">
  <div class="card-header">
    <h4 class="card-title">View Distributor</h4>
  </div>
  <form [formGroup]="viewDealershipForm">
    <div class="card-body">
      <div class="row">
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field style="width: 100%;">
              <mat-label>Zone</mat-label>
              <input matInput [value]="this.data.element.territory.area.zone.name" readonly />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field style="width: 100%;">
              <mat-label>Territory</mat-label>
              <input matInput [value]="this.data.element.territory.name" readonly />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field style="width: 100%;">
              <mat-label>Name</mat-label>
              <input matInput [value]="this.data.element.name" readonly />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field style="width: 100%;">
              <mat-label>Phone No</mat-label>
              <input matInput [value]="this.data.element.phoneNo" readonly />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field style="width: 100%;">
              <mat-label>Address</mat-label>
              <input matInput [value]="this.data.element.address" readonly />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field class="example-full-width">
              <mat-label>Pin Location</mat-label>
              <textarea matInput [value]="this.data.element.pinLocation" rows="4" readonly>
              </textarea>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <button class="btn btn-primary" (click)="viewPinLocation()">
              <i class="fa fa-map-marker"></i> View Pin Location
            </button>
          </div>
        </div>

        <div class="col-md-12">
          <div class="row">
            <div class="col-md-12 mt-3">
              <div class="d-inline-flex flex-wrap w-100">
                <div class="uploaded_doc_wrap" *ngFor="let document of this.documents; let dIndex = index">
                  <div class="file_upload text-center doucment_wrap">
                    <div class="w-100 d-inline-block" (click)="GetDocument($event, dIndex, documentView)">
                      <!-- <div class="fa fa-file-text-o"></div>
                      <div class="" style="font-size: 12px; font-weight: 900;margin-left: 10px">
                        {{document?.id != 0 ? document?.imageName?.split('/assets/Files/')[1] : document?.imageName }}
                      </div> -->
                      <img style="width: -webkit-fill-available;" src="{{ document?.imageName }}">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
    <div class="card-footer">
      <button [mat-dialog-close]="true" class="btn btn-danger" data-bs-dismiss="modal">
        Close
      </button>
    </div>
  </form>
</div>

<ng-template #documentView>
  <div class="card">
    <div class="card-body" style="height: 700px;">
      <iframe width="100%" height="100%" frameBorder="0" [src]="urlSafe"></iframe>
    </div>
    <div class="card-footer">
      <button class="btn btn-danger" [mat-dialog-close]>Close</button>
    </div>
  </div>
</ng-template>
