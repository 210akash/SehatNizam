<mat-card>
  <mat-card-header>
    <mat-card-title>Pricing Group Form</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>

    <form [formGroup]="createPricingGroupForm">
      <div class="row">
        <div class="col-md-12">
          <mat-form-field class="form-field">
            <mat-label>Title</mat-label>
            <input matInput placeholder="Title" formControlName="title" />
          </mat-form-field>
        </div>
        <div class="col-md-12">
          <mat-form-field class="form-field">
            <mat-label>Description</mat-label>
            <textarea matInput placeholder="Description" rows="4" formControlName="description">
                  </textarea>
          </mat-form-field>
        </div>
      </div>
      <mat-divider class="mt-2"></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="success" type="button" (click)="savePricingGroup()">
          <span class="mat-button-wrapper">Save</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
