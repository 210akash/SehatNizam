<ng-template #deletePricingGgroupTemplate>
  <mat-card>
  <mat-card-header>
    <mat-card-title>Delete Pricing Group</mat-card-title>
  </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content>
    <p>Are you sure you want to delete this Pricing Group?</p>
    <mat-divider></mat-divider>
    <div class="button-container">
        <button mat-flat-button color="default" [mat-dialog-close]="true" (click)="deletePricing()" >
        <span class="mat-button-wrapper">Delete</span>
      </button>
      <button mat-flat-button color="default" [mat-dialog-close]="true">
        <span class="mat-button-wrapper">Close</span>
      </button>
    </div>
  </mat-card-content>
</mat-card>
</ng-template>


<div class="header-container">
  <h2>Pricing Group</h2>
  <button *appHasRole="['admin', 'sales']" mat-mini-fab aria-label="Add" color="success" (click)="openProductDialog(null)" matTooltip="Add Pricing Group">
      <mat-icon>add</mat-icon>
  </button>
</div>

<div class="body-container">
  <!-- <form  class="form-horizontal form-label-left">
      <div class="row">
          <div class="col-md-6">
              <div class="mt-2">
                  <mat-form-field>
                      <mat-label>Name</mat-label>
                      <input matInput placeholder="Name" formControlName="name" (keyup)="filterData()" />
                  </mat-form-field>
              </div>
          </div>
      </div>
  </form> -->

  <div class="mat-elevation-z8 table-responsive mt-2">

      <table mat-table [dataSource]="dataSource" matSort>

        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef class="text-dark"> Title</th>
          <td mat-cell *matCellDef="let element"> {{element.title}} </td>
      </ng-container>

      <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="text-dark"> Description</th>
          <td mat-cell *matCellDef="let element"> {{element.description}} </td>
      </ng-container>


      <ng-container matColumnDef="createdDate">
          <th mat-header-cell *matHeaderCellDef class="text-dark"> Created Date</th>
          <td mat-cell *matCellDef="let element"> {{element.createdDate | date: 'd MMM y h:mm a'}} </td>
      </ng-container>

          <!-- Actions column definition -->
          <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef style="width: 11%;"> Actions </th>
              <td mat-cell *matCellDef="let element">
                  <div class="action_btns">
                      
                      <button *appHasRole="['admin', 'sales']" mat-mini-fab matTooltip="Product Pricing" color="success" (click)="openProductPricing(element, false)">
                          <i class="fa fa-money"></i>
                      </button>

                      <button mat-mini-fab matTooltip="View Product Pricing" color="danger" (click)="openProductPricing(element, true)">
                          <i class="fa fa-eye"></i>
                      </button>

                      <button *appHasRole="['admin', 'sales']" mat-mini-fab matTooltip="Edit Price Group" color="primary" (click)="openProductDialog(element)">
                        <i class="fa fa-edit"></i>
                      </button>

                      <button *appHasRole="['admin', 'sales']" mat-mini-fab matTooltip="Map Group With Distributor" color="success" (click)="openDistributorPriceGroup(element)">
                        <i class="fa fa-plus-square-o"></i>
                      </button>

                       <button *appHasRole="['admin', 'sales']" mat-mini-fab matTooltip="Copy Product Pricing" color="dark" (click)="copyProductPricing(element, true)">
                          <i class="fa fa-copy"></i>
                      </button>

                      <button *appHasRole="['admin', 'sales']" mat-mini-fab matTooltip="Delete Price Group" color="warn" (click)="openDeletePricingGroupPopup(element, deletePricingGgroupTemplate)">
                        <i class="fa fa-trash"></i>
                      </button>
                  </div>
              </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns;  sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
  </div>
</div>
