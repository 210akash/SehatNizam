<div class="header-container">
  <h2>Retail Order History</h2>
</div>

<div class="body-container">
  <div class="mat-elevation-z8 table-responsive mt-2">
    <table mat-table [dataSource]="dataSource">

      <!--From Status Column-->
      <ng-container matColumnDef="fromStatus">
        <th mat-header-cell *matHeaderCellDef class="text-dark"> From Status</th>
        <td  mat-cell *matCellDef="let element"> {{element.fromStatus?.title}} </td>
      </ng-container>

      <!--To Status Column-->
      <ng-container matColumnDef="toStatus">
        <th mat-header-cell *matHeaderCellDef class="text-dark"> To Status</th>
        <td  mat-cell *matCellDef="let element"> {{element.toStatus?.title}} </td>
      </ng-container>

      <!--Comments Column-->
      <ng-container matColumnDef="comments">
        <th mat-header-cell *matHeaderCellDef class="text-dark"> Comments</th>
        <td  mat-cell *matCellDef="let element"> {{element.comments}} </td>
      </ng-container>

      <!--User Column-->
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef class="text-dark"> User</th>
        <td  mat-cell *matCellDef="let element"> {{element.createdBy?.firstName}} </td>
      </ng-container>

      <!--Created Date  Column-->
      <ng-container matColumnDef="createdDate">
        <th mat-header-cell *matHeaderCellDef class="text-dark"> Date</th>
        <td  mat-cell *matCellDef="let element"> {{element.createdDate | date: 'd MMM y h:mm a'}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns;  sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
  <div class="button-container">
    <button mat-flat-button color="default" [mat-dialog-close]="true">
      <span class="mat-button-wrapper">Close</span>
    </button>
  </div>
</div>
