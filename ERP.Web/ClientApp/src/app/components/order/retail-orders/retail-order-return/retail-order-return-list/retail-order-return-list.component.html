<div class="mat-elevation-z8 table-responsive">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- Columns -->

    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Sale Return Code </th>
      <td mat-cell *matCellDef="let element"> {{ element.code }} </td>
    </ng-container>

        <ng-container matColumnDef="orderId">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Order Id</th>
      <td mat-cell *matCellDef="let element"> {{ element.retailOrderId }} </td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
      <td mat-cell *matCellDef="let element"> {{ element.createdDate | date : 'shortDate' }} </td>
    </ng-container>

      <ng-container matColumnDef="modifiedDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Processed Date </th>
        <td mat-cell *matCellDef="let element"> {{ element.modifiedDate | date : 'shortDate' }} </td>
      </ng-container>

      <ng-container matColumnDef="createdBy">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Created By</th>
        <td mat-cell *matCellDef="let element"> {{ element.createdBy?.firstName + ' ' + element.createdBy?.lastName }} </td>
      </ng-container>

      <!-- <ng-container matColumnDef="processedBy">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Processed By</th>
        <td mat-cell *matCellDef="let element"> {{ element.processedBy?.firstName + ' ' + element.processedBy?.lastName }} </td>
      </ng-container> -->

    <!-- Actions column definition -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef style="width: 11%;"> Actions </th>
      <td mat-cell *matCellDef="let element">
        <div class="action_btns">
          <button mat-mini-fab matTooltip="Edit" color="primary" *ngIf="element.statusId == 1"
            (click)="openRetailOrderReturnDialog(element)">
            <mat-icon aria-label="Edit">edit</mat-icon>
          </button>

          <button mat-mini-fab matTooltip="View" color="dark" (click)="viewRetailOrderReturnDialog(element)">
            <mat-icon aria-label="View">visibility</mat-icon>
          </button>

          <button mat-mini-fab matTooltip="Delete" color="warn" *ngIf="element.statusId == 1"
            (click)="deleteRetailOrderReturnDialog(element)">
            <mat-icon aria-label="Delete">delete</mat-icon>
          </button>

          <button mat-mini-fab matTooltip="Post" *ngIf="element.statusId == 1" color="success"
            (click)="processRetailOrderReturnDialog(element)">
            <mat-icon aria-label="Post">send</mat-icon>
          </button>

          <button mat-mini-fab matTooltip="Print" *ngIf="element.statusId == 3" color="success"
            (click)="printRetailOrderReturnDialog(element)">
            <mat-icon aria-label="Print">print</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>

    <!-- Table rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-divider></mat-divider>
  <!-- Paginator -->
  <mat-paginator #paginator [length]="totalRows" [pageIndex]="currentPage" [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions" (page)="pageChanged($event)" aria-label="Select page">
  </mat-paginator>
</div>
