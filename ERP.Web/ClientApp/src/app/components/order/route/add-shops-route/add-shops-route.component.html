<div class="card">
  <div class="card-header">
    <h4 class="card-title">Add Shops in Route</h4>
  </div>
  <form [formGroup]="addShopsRouteForm">
    <div class="card-body">
      <div class="row">
        <div class="col-md-3">
          <div class="mb-3">
            <mat-form-field>
              <input matInput placeholder="Zone" formControlName="zone" readonly />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-3">
          <div class="mb-3">
            <mat-form-field>
              <input matInput placeholder="Territory" formControlName="territory" readonly />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-3">
          <div class="mb-3">
            <mat-form-field class="example-full-width">
              <input matInput placeholder="Route Name" formControlName="name" readonly />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-3">
          <div class="mb-3">
            <mat-form-field>
              <input matInput placeholder="Visit Day" formControlName="visitDay" readonly />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-3">
          <div class="mb-3">
            <mat-form-field class="example-full-width">
              <input matInput placeholder="Total Shops" formControlName="totalShops" readonly />
            </mat-form-field>
          </div>
        </div>
      </div>

      <div class="col-md-12">
        <button class="btn btn-primary" data-bs-dismiss="modal" (click)="selectRouteShops()">
          Select Route Shop
        </button>
      </div>

      <div class="col-md-12" *ngIf="dataSource.length > 0">
        <div class="table-responsive">
          <h4><strong>Route Shops</strong></h4>
          <table mat-table [dataSource]="dataSource" class="table table-bordered table-striped datatable">

            <colgroup>
              <col style="width: 10%;">
              <col style="width: 20%;">
              <col style="width: 60%;">
              <col style="width: 10%;">
            </colgroup>

            <!--Sequence Column-->
            <ng-container matColumnDef="sequenceNo">
              <th *matHeaderCellDef class="text-dark"> Seq. No</th>
              <td *matCellDef="let element"> {{element.sequenceNo}} </td>
            </ng-container>

            <!--Name Column-->
            <ng-container matColumnDef="name">
              <th *matHeaderCellDef class="text-dark"> Shop Name</th>
              <td *matCellDef="let element"> {{element.shop?.name}} </td>
            </ng-container>

            <!--Address Column-->
            <ng-container matColumnDef="address">
              <th *matHeaderCellDef class="text-dark"> Address</th>
              <td *matCellDef="let element"> {{element.shop?.address}} </td>
            </ng-container>

            <ng-container matColumnDef="actions">
              <th *matHeaderCellDef class="text-dark">Action</th>
              <td *matCellDef="let element">
                <button (click)="viewPinLocation(element)" class="btn btn-primary btn-sm" matTooltip="Pin Location">
                  <i class="fa fa-map-marker"></i>
                </button>
                <button (click)="openDeleteRouteShopPopup(element, deleteRouteShopTemplate)"
                  class="btn btn-danger btn-sm" matTooltip="Delete Route Shop">
                  <i class="fa fa-trash"></i>
                </button>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns;  sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
      </div>

      <div *ngIf="this.finalRows?.length > 0" class="route-container">
        <h5>Selected Route</h5>
        <ul class="route-list">
          <li *ngFor="let shop of this.finalRows; let i = index" class="route-item">
            <div class="route-step">
              <span class="route-number">{{ shop.sequence }}</span>
              <span class="shop-name">{{ shop.name }}</span>
            </div>
            <div *ngIf="i < this.finalRows?.length - 1" class="route-arrow">
              &#8594; <!-- Right arrow to indicate direction -->
            </div>
          </li>
        </ul>
      </div>

    </div>
    <div class="card-footer">
      <button class="btn btn-success" data-bs-dismiss="modal" (click)="saveAddShops()">
        Save
      </button>
      <button [mat-dialog-close]="true" class="btn btn-danger ml-2" data-bs-dismiss="modal">
        Close
      </button>
    </div>
  </form>
</div>

<ng-template #deleteRouteShopTemplate>
  <div class="card">
    <div class="card-header">
      <h4>Delete RouteShop</h4>
    </div>
    <div class="card-body">
      <p>Are you sure you want to delete this RouteShop?</p>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="deleteRouteShop()">Delete</button>
      <button class="btn btn-danger" [mat-dialog-close]>Close</button>
    </div>
  </div>
</ng-template>
