<mat-card>
  <mat-card-header>
    <mat-card-title>Create Route <span *ngIf="!isDropDownShow"> (Zone: {{this.currentuser.zone.name}} Territory:
        {{this.currentuser.territory.name}})</span></mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <form [formGroup]="createRouteForm">
      <div class="row">
        <div class="col-md-6" *ngIf="isDropDownShow">
          <div class="mb-3">
            <mat-form-field>
              <mat-label>Region</mat-label>
              <mat-select formControlName="regionId" (selectionChange)="getZoneByRegionId()">
                <mat-option [value]=0>-- Select --</mat-option>
                <mat-option *ngFor="let option of regionList" [value]="option.id">{{option.name}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-6" *ngIf="isDropDownShow">
          <div class="mb-3">
            <mat-form-field>
              <mat-label>Zone</mat-label>
              <mat-select formControlName="zoneId" (selectionChange)="getAreaByZoneId()">
                <mat-option [value]=0>-- Select --</mat-option>
                <mat-option *ngFor="let option of zoneList" [value]="option.id">{{option.name}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-6" *ngIf="isDropDownShow">
          <div class="mb-3">
            <mat-form-field>
              <mat-label>Area</mat-label>
              <mat-select formControlName="areaId" (selectionChange)="getTerritoryByAreaId()">
                <mat-option [value]=0>-- Select --</mat-option>
                <mat-option *ngFor="let option of areaList" [value]="option.id">{{option.name}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-6" *ngIf="isDropDownShow">
          <div class="mb-3">
            <mat-form-field>
              <mat-label>Territory</mat-label>
              <mat-select formControlName="territoryId">
                <mat-option [value]=0>-- Select --</mat-option>
                <mat-option *ngFor="let option of territoryList" [value]="option.id">{{option.name}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>

        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field class="example-full-width">
              <mat-label>Route Name</mat-label>
              <input matInput placeholder="Route Name" formControlName="name" />
            </mat-form-field>
          </div>
        </div>
      </div>
      <mat-divider class="mt-2"></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="success" type="button" (click)="saveRoute()">
          <span class="mat-button-wrapper">Save</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
