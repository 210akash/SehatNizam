<ng-template #documentView>
  <div class="card">
    <div class="card-body" style="height: 700px;">
      <iframe width="100%" height="100%" frameBorder="0" [src]="urlSafe"></iframe>
    </div>
    <div class="card-footer">
      <button class="btn btn-danger" [mat-dialog-close]>Close</button>
    </div>
  </div>
</ng-template>

<mat-card>
  <mat-card-header>
    <mat-card-title>Delete Shop</mat-card-title>
  </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content>

    <div class="row">
      <div class="col-md-12">
        <div class="mb-3">
          <mat-form-field style="width: 100%;">
            <mat-label>Zone</mat-label>
            <input matInput [value]="this.data.element.territory.area.zone.name" readonly />
          </mat-form-field>
        </div>
      </div>
      <div class="col-md-12">
        <div>
          <mat-form-field style="width: 100%;">
            <mat-label>Territory</mat-label>
            <input matInput [value]="this.data.element.territory.name" readonly />
          </mat-form-field>
        </div>
      </div>
      <div class="col-md-12">
        <div>
          <mat-form-field style="width: 100%;">
            <mat-label>Name</mat-label>
            <input matInput [value]="this.data.element.name" readonly />
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-12">
        <div>
          <mat-form-field style="width: 100%;">
            <mat-label>Owner Name</mat-label>
            <input matInput [value]="this.data.element.ownerName" readonly />
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-12">
        <div>
          <mat-form-field style="width: 100%;">
            <mat-label>Opening Time</mat-label>
            <input matInput [value]="this.data.element.openingTime" readonly />
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-12">
        <div>
          <mat-form-field style="width: 100%;">
            <mat-label>Closing Time</mat-label>
            <input matInput [value]="this.data.element.closingTime" readonly />
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-12">
        <div>
          <mat-form-field style="width: 100%;">
            <mat-label>Phone No</mat-label>
            <input matInput [value]="this.data.element.phoneNo" readonly />
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-12">
        <div>
          <mat-form-field style="width: 100%;">
            <mat-label>Is Verified</mat-label>
            <input matInput [value]="this.data.element.isVerified" readonly />
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-12">
        <div>
          <mat-form-field style="width: 100%;">
            <mat-label>Is Tag From Mob</mat-label>
            <input matInput [value]="this.data.element.isTagFromMob" readonly />
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-12">
        <div>
          <mat-form-field style="width: 100%;">
            <mat-label>Address</mat-label>
            <input matInput [value]="this.data.element.address" readonly />
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-12">
        <div>
          <mat-form-field style="width: 100%;">
            <mat-label>Pin Location</mat-label>
            <textarea matInput rows="4" [value]="this.data.element.pinLocation" readonly>
              </textarea>
          </mat-form-field>
        </div>
      </div>

      <div class="col-md-12">
        <div class="row">
          <div class="col-md-12 mt-3">
            <div class="d-inline-flex flex-wrap w-100">
              <div class="uploaded_doc_wrap" *ngFor="let document of this.documents; let dIndex = index">
                <div class="file_upload text-center doucment_wrap">
                  <div class="w-100 d-inline-block" (click)="GetDocument($event, dIndex, documentView)">
                    <img style="width: -webkit-fill-available;" src="{{ document?.imageName }}">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <mat-divider></mat-divider>
    <div class="button-container">
      <button mat-flat-button color="danger" type="button" (click)="delete()">
        <span class="mat-button-wrapper">Delete</span>
      </button>
      <button mat-flat-button color="default" [mat-dialog-close]="true">
        <span class="mat-button-wrapper">Close</span>
      </button>
    </div>
  </mat-card-content>
</mat-card>
