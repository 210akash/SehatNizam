<div class="header-container">
  <h2>Template List</h2>
  <button mat-mini-fab aria-label="Add" color="success" (click)="openAddTemplateDialog(null)" matTooltip="Add Template">
      <mat-icon>add</mat-icon>
  </button>
</div>

<div class="body-container">

  <div class="mat-elevation-z8 table-responsive mt-2">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef class="text-dark"> ID</th>
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <!--Name Column-->
      <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="text-dark"> Name</th>
          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <!--Description Column-->
      <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="text-dark"> Description</th>
          <td mat-cell *matCellDef="let element"> {{element.description}} </td>
      </ng-container>

      <!--Content Column-->
      <ng-container matColumnDef="content">
          <th mat-header-cell *matHeaderCellDef class="text-dark"> Content</th>
          <td mat-cell *matCellDef="let element"> {{element.content | slice:0:150}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns;  sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Action</th>
          <td mat-cell *matCellDef="let element">
              <button mat-icon-button (click)="openEditTemplateDialog(element)"
                  class="btn btn-primary btn-link">
                  <mat-icon>edit</mat-icon>
              </button>
      </ng-container>
    </table>
    <mat-paginator #paginator [length]="totalRows" [pageIndex]="currentPage" [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions" (page)="pageChanged($event)" aria-label="Select page">
    </mat-paginator>
  </div>
</div>
