<mat-card>
  <mat-card-header>
    <mat-card-title>Territory Form</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <form [formGroup]="createTerritoryForm">
      <div class="row">
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field>
              <mat-label>Region</mat-label>
              <mat-select formControlName="regionId"
                (selectionChange)="getZoneByRegionId();onRegionChange($event.value)">
                <mat-option [value]=0>-- Select --</mat-option>
                <mat-option *ngFor="let option of regionList" [value]="option.id">{{option.name}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field>
              <mat-label>Zone</mat-label>
              <mat-select formControlName="zoneId" (selectionChange)="getAreaByZoneId();onZoneChange($event.value)">
                <mat-option [value]=0>-- Select --</mat-option>
                <mat-option *ngFor="let option of zoneList" [value]="option.id">{{option.name}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field>
              <mat-label>Area</mat-label>
              <mat-select formControlName="areaId" (selectionChange)="onAreaChange($event.value)">
                <mat-option [value]=0>-- Select --</mat-option>
                <mat-option *ngFor="let option of areaList" [value]="option.id">{{option.name}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field class="example-full-width">
              <input matInput placeholder="Name" formControlName="name" />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field class="example-full-width">
              <mat-label>Sale Model</mat-label>
              <mat-select formControlName="saleModel">
                <mat-option value="">-- Select --</mat-option>
                <mat-option value="Pre Seller">Pre Seller</mat-option>
                <mat-option value="On Spot">On Spot</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field class="example-full-width">
              <mat-label>Description</mat-label>
              <input matInput placeholder="Description" formControlName="description" />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field class="example-full-width">
              <mat-label>Coordinates</mat-label>
              <textarea matInput placeholder="Coordinates" rows="4" formControlName="coordinates" readonly>
              </textarea>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="button-container">
            <button mat-flat-button color="success" (click)="drawTerritory()">
              <i class="fa fa-map-o"></i> Draw Territory
            </button>
            <button *ngIf="isEditMode" mat-flat-button color="default" (click)="editTerritory()">
              <i class="fa fa-pencil-square-o"></i> Edit Territory
            </button>
          </div>
        </div>
      </div>
      <mat-divider class="mt-2"></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="success" type="button" (click)="saveTerritory()">
          <span class="mat-button-wrapper">Save</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
