<mat-card>
  <mat-card-header>
    <mat-card-title>Zone Form</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <form [formGroup]="createZoneForm">
      <div class="row">
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field>
              <mat-label>Region</mat-label>
              <mat-select formControlName="regionId" (selectionChange)="onRegionChange($event.value)">
                <mat-option [value]=0>-- Select --</mat-option>
                <mat-option *ngFor="let option of regionList" [value]="option.id">{{option.name}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field class="form-field">
              <mat-label>Name</mat-label>
              <input matInput placeholder="Name" formControlName="name" />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field class="form-field">
              <mat-label>Description</mat-label>
              <textarea matInput placeholder="Description" rows="4" formControlName="description" readonly>
                </textarea>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div>
            <mat-form-field class="form-field">
              <mat-label>Coordinates</mat-label>
              <textarea matInput placeholder="Coordinates" rows="4" formControlName="coordinates">
                </textarea>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="button-container">
            <button mat-flat-button color="success" (click)="drawZone()">
              <i class="fa fa-map-o"></i> Draw Zone
            </button>
            <button *ngIf="isEditMode" mat-flat-button color="default" (click)="editZone()">
              <i class="fa fa-pencil-square-o"></i> Edit Zone
            </button>
          </div>
        </div>
      </div>
      <mat-divider class="mt-2"></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="success" type="button" (click)="saveZone()">
          <span class="mat-button-wrapper">Save</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
