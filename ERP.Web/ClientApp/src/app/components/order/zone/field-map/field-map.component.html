<div class="main-content">
  <div class="container-fluid">
    <div class="card">
      <div class="card-header">
        <div class="row justify-content-between align-items-center px-3">
          <h4 class="mb-0"><strong>Field Map</strong></h4>
        </div>
      </div>
      <div class="card-body">
        <form [formGroup]="fieldMapForm">
          <div class="row">

            <div class="col-md-2">
              <mat-form-field>
                <mat-label>Zone</mat-label>
                <mat-select formControlName="zoneId" (selectionChange)="onZoneChange()">
                  <mat-option [value]=0>-- ALL --</mat-option>
                  <mat-option *ngFor="let option of zoneList" [value]="option.id">{{option.name}}</mat-option>
                </mat-select>
              </mat-form-field>
            </div>

            <!-- Territory -->
            <div class="col-md-2">
              <div class="d-flex align-items-center">
                <mat-checkbox formControlName="territoryfilterEnabled" class="mr-2"> </mat-checkbox>
                <mat-form-field>
                  <mat-label>Territory</mat-label>
                  <mat-select formControlName="territoryId" (selectionChange)="onTerritoryChange()">
                    <mat-option [value]=0>-- ALL --</mat-option>
                    <mat-option *ngFor="let option of territoryList" [value]="option.id">{{option.name}}</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>

            <!-- Distributor -->
            <div class="col-md-2">
              <div class="d-flex align-items-center">
                <mat-checkbox formControlName="dealershipfilterEnabled" class="mr-2"> </mat-checkbox>
                <mat-form-field>
                  <mat-label>Distributor</mat-label>
                  <mat-select formControlName="dealershipId">
                    <mat-option [value]=0>-- ALL --</mat-option>
                    <mat-option *ngFor="let option of dealershipList" [value]="option.id">{{option.name}}</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>

            <!-- Shop -->
            <div class="col-md-2">
              <div class="d-flex align-items-center">
                <mat-checkbox formControlName="shopfilterEnabled" class="mr-2"> </mat-checkbox>
                <mat-form-field>
                  <mat-label>Shop</mat-label>
                  <mat-select formControlName="shopId">
                    <mat-option [value]=0>-- ALL --</mat-option>
                    <mat-option *ngFor="let option of shopList" [value]="option.id">{{option.name}}</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>

            <div class="col-md-2">
              <button class="btn btn-primary" data-bs-dismiss="modal" (click)="filter()">Load</button>
            </div>

          </div>
        </form>
        <div id="fieldMap"></div>
      </div>
    </div>
  </div>
</div>
