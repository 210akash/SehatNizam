<div class="card">
  <div class="card-header">
    <h4 class="card-title">View Zone</h4>
  </div>
  <form [formGroup]="viewZoneForm">
    <div class="card-body">
      <div class="row">
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field style="width: 100%;">
              <mat-label>Name</mat-label>
              <input matInput [value]="this.data.element.name" readonly />
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <mat-form-field style="width: 100%;">
              <mat-label>Description</mat-label>
              <textarea matInput placeholder="Description" rows="4" [value]="this.data.element.description" readonly>
                </textarea>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div>
            <mat-form-field style="width: 100%;">
              <mat-label>Coordinates</mat-label>
              <textarea matInput placeholder="Coordinates" rows="4" [value]="this.data.element.coordinates" readonly>
                </textarea>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-12">
          <div class="mb-3">
            <button class="btn btn-primary" data-bs-dismiss="modal" (click)="viewZone()">
              <i class="fa fa-map-o"></i> View Zone
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <button [mat-dialog-close]="true" class="btn btn-danger" data-bs-dismiss="modal">
        Close
      </button>
    </div>
  </form>
</div>
