<mat-card>
  <mat-card-header>
    <mat-card-title>View Payment Mode</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
  <div class="row">
    <div class="col-md-12">
      <mat-form-field style="width: 100%;">
        <mat-label>Name</mat-label>
        <input matInput type="text" value="{{this.data.element.name}}" readonly>
      </mat-form-field>
    </div>
      <div class="col-md-12">
      <mat-form-field style="width: 100%;">
        <mat-label>Voucher Type</mat-label>
        <input matInput type="text" value="{{this.data.element.voucherType?.name}}" readonly>
      </mat-form-field>
    </div>
    </div>
    <mat-divider></mat-divider>
      <div class="button-container">
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
  </mat-card-content>
</mat-card>
