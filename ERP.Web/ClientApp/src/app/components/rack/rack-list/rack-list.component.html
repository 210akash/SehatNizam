<div class="header-container">
  <h2>Rack</h2>
  <button mat-mini-fab aria-label="Add" color="success" (click)="openRackDialog(null)" matTooltip="Add Company">
      <mat-icon>add</mat-icon>
  </button>
</div>

<div class="body-container">
  <form [formGroup]="rackListFilerForm" class="form-horizontal form-label-left">
      <div class="row">
          <div class="col-md-3">
              <div class="mt-2">
                  <mat-form-field>
                      <mat-label>Name</mat-label>
                      <input matInput placeholder="Name" formControlName="name" (keyup)="filterData()" />
                  </mat-form-field>
              </div>
          </div>
      </div>
  </form>

  <div class="mat-elevation-z8 table-responsive mt-2">

      <table mat-table [dataSource]="dataSource" matSort>
          <!--Name  Column-->
          <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-dark"> Name</th>
              <td  mat-cell *matCellDef="let element"> {{element.name}} </td>
          </ng-container>

          <!-- Actions column definition -->
          <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef style="width: 11%;"> Actions </th>
              <td mat-cell  mat-cell *matCellDef="let element">
                  <div class="action_btns">
                      <button mat-mini-fab matTooltip="Edit" color="primary" (click)="openRackDialog(element)">
                          <mat-icon aria-label="Edit">edit</mat-icon>
                      </button>

                      <button mat-mini-fab matTooltip="View" color="dark" (click)="openViewRackDialog('3000','1500',element)">
                          <mat-icon aria-label="View">visibility</mat-icon>
                      </button>

                      <button mat-mini-fab matTooltip="Delete" color="warn" (click)="openDeleteDialog(element)">
                          <mat-icon aria-label="Delete">delete</mat-icon>
                      </button>
                  </div>
              </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns;  sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator #paginator [length]="totalRows" [pageIndex]="currentPage" [pageSize]="pageSize"
          [pageSizeOptions]="pageSizeOptions" (page)="pageChanged($event)" aria-label="Select page">
      </mat-paginator>

  </div>
</div>
