
<div class="header-container">
  <h2> Account Ledger Report</h2>
</div>

<div class="body-container">
  <form [formGroup]="TransactionFilterForm">
    <div class="row">
      <div class="col-lg-2 col-md-3">
        <div class="mt-2">
          <mat-form-field class="form-field">
            <mat-label>From Date</mat-label>
            <input matInput [matDatepicker]="fdate" formControlName="fdate">
            <mat-datepicker-toggle matIconSuffix [for]="fdate"></mat-datepicker-toggle>
            <mat-datepicker #fdate></mat-datepicker>
          </mat-form-field>
        </div>
      </div>
      <div class="col-lg-2 col-md-3">
        <div class="mt-2">
          <mat-form-field class="form-field">
            <mat-label>To Date</mat-label>
            <input matInput [matDatepicker]="tdate" formControlName="tdate">
            <mat-datepicker-toggle matIconSuffix [for]="tdate"></mat-datepicker-toggle>
            <mat-datepicker #tdate></mat-datepicker>
          </mat-form-field>
        </div>
      </div>
      <div class="col-md-5">
        <div class="mt-2">
          <div class="accountwrap">
            <mat-checkbox
            class="example-margin"
            formControlName="isGroup"
            (change)="showOptions($event)"
            matTooltip="Group"
          >
        </mat-checkbox>
            <mat-form-field>
              <input matInput formControlName="accountName" [matAutocomplete]="auto"
                (keyup)="getAccountList($event);" class="form-control" (input)="onInputCleared($event)"
                type="search"/>
              <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onOptionSelected($event)">
                <mat-option *ngFor="let account of accountList" [value]="account">
                  {{ account?.code }} : {{ account?.name }}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>
        </div>
      </div>

      <div class="col-lg-2 col-md-3">
        <button  mat-flat-button color="success" type="button" (click)="filterData()">
          <span class="mat-button-wrapper" >Load Report</span>
        </button>
      </div>
    </div>
  </form>
  <mat-divider></mat-divider>
    <div class="report-container">
      <iframe class="responsive-iframe" [src]="reportUrlSafe"  width="100%" title="Iframe Example"></iframe>
  </div>
</div>
