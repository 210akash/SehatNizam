<mat-card>
  <mat-card-header>
    <mat-card-title>Section Form</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>

    <form [formGroup]="createSectionForm">
        <div class="row">
          <div class="col-md-12">
              <mat-form-field class="form-field">
                <mat-label>Name</mat-label>
                <input matInput placeholder="Name" formControlName="name" />
              </mat-form-field>
          </div>
          <div class="col-md-12">
            <mat-form-field class="form-field">
              <mat-label>Rack</mat-label>
              <mat-select placeholder="Rack" formControlName="rackId" (selectionChange)="getRowListById()">
                <mat-option [value]="0">--Select--</mat-option>
                <mat-option *ngFor="let rack of rackList" [value]="rack.id">{{rack.name}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div class="col-md-12">
            <mat-form-field class="form-field">
              <mat-label>Row</mat-label>
              <mat-select placeholder="Row" formControlName="rowId">
                <mat-option *ngFor="let row of rowList" [value]="row.id">{{row.name}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <mat-divider class="mt-2"></mat-divider>
        <div class="button-container">
          <button mat-flat-button color="success" type="button" (click)="saveSection()">
            <span class="mat-button-wrapper">Save</span>
          </button>
          <button mat-flat-button color="default" [mat-dialog-close]="true">
            <span class="mat-button-wrapper">Close</span>
          </button>
        </div>
    </form>
  </mat-card-content>
</mat-card>
