<mat-card>
  <mat-card-header>
    <div class="header-container">
      <mat-card-title>View Section</mat-card-title>
    </div>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <div class="row">
      <div class="col-md-12 col-lg-12">
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput [value]="this.data.element.name"  readonly>
        </mat-form-field>
      </div>
      <div class="col-md-12 col-lg-12">
        <mat-form-field>
          <mat-label>Rack</mat-label>
          <input matInput [value]="this.data.element.row.rack.name" readonly>
        </mat-form-field>
      </div>
      <div class="col-md-12 col-lg-12">
        <mat-form-field>
          <mat-label>Row</mat-label>
          <input matInput [value]="this.data.element.row.name" readonly>
        </mat-form-field>
      </div>
    </div>
    <mat-divider></mat-divider>
    <div class="button-container">
      <button mat-flat-button color="default" [mat-dialog-close]="true">
        <span class="mat-button-wrapper">Close</span>
      </button>
    </div>
  </mat-card-content>
</mat-card>
