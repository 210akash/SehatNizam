<mat-card>
  <mat-card-header>
    <mat-card-title>Vendor Form</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>

  <mat-card-content>

    <form [formGroup]="vendorForm" >
      <input type="hidden" formControlName="id" />
      <div class="row">
        <div class="col-md-12">
      <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" type="text">
      </mat-form-field>
    </div>

    <div class="col-md-12">
      <mat-form-field>
        <mat-label>Address</mat-label>
        <input matInput formControlName="address" type="text">
      </mat-form-field>
    </div>

    <div class="col-md-12">
      <mat-form-field>
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone" type="text">
      </mat-form-field>
    </div>

    <div class="col-md-12">
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="text">
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field>
        <mat-label>NTN</mat-label>
        <input matInput formControlName="nTN" type="text">
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field >
        <mat-label>Credit Days</mat-label>
        <input matInput formControlName="creditDays" type="number">
      </mat-form-field>
    </div>

    <div class="col-md-12">
      <mat-form-field>
        <mat-label>Description</mat-label>
        <textarea matInput rows="2" formControlName="description">
        </textarea>
      </mat-form-field>
    </div>
    </div>
      <div class="button-container">
        <button mat-flat-button color="success" type="button" (click)="SaveData()">
          <span class="mat-button-wrapper">Save</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
    </form>
  </mat-card-content>

</mat-card>
