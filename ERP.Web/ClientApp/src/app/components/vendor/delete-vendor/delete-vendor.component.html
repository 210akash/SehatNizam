<mat-card>
  <mat-card-header>
    <mat-card-title>Delete Vendor</mat-card-title>
  </mat-card-header>

  <mat-divider></mat-divider>
  <mat-card-content>
      <div class="row">
        <div class="col-md-12">
      <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput [value]="this.data.element.name" type="text" readonly>
      </mat-form-field>
    </div>

    <div class="col-md-12">
      <mat-form-field>
        <mat-label>Address</mat-label>
        <input matInput [value]="this.data.element.address" type="text" readonly>
      </mat-form-field>
    </div>

    <div class="col-md-12">
      <mat-form-field>
        <mat-label>Phone</mat-label>
        <input matInput [value]="this.data.element.phone" type="text" readonly>
      </mat-form-field>
    </div>

    <div class="col-md-12">
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput [value]="this.data.element.email" type="text" readonly>
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field>
        <mat-label>NTN</mat-label>
        <input matInput [value]="this.data.element.nTN" type="text" readonly>
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field >
        <mat-label>Credit Days</mat-label>
        <input matInput [value]="this.data.element.creditDays" type="number" readonly>
      </mat-form-field>
    </div>

    <div class="col-md-12">
      <mat-form-field>
        <mat-label>Description</mat-label>
        <textarea matInput rows="2" [value]="this.data.element.description" readonly>
        </textarea>
      </mat-form-field>
    </div>
    </div>
      <div class="button-container">
        <button mat-flat-button color="danger" type="button" (click)="delete()">
          <span class="mat-button-wrapper">Delete</span>
        </button>
        <button mat-flat-button color="default" [mat-dialog-close]="true">
          <span class="mat-button-wrapper">Close</span>
        </button>
      </div>
  </mat-card-content>
</mat-card>
